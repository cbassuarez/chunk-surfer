<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:repeating-linear-gradient(45deg,#572453 0 30px,#73396f 30px 60px);color:white;font:18px system-ui}button{position:absolute;left:24px;top:24px;padding:20px;background:#f3df4c;color:#241f13;border:2px solid white;font:18px system-ui;min-width:240px}p{position:absolute;top:110px;left:24px;max-width:340px}#count{position:absolute;left:24px;top:175px;font:28px monospace}</style></head><body><button type="button">Click-through witness</button><p>This opaque game-owned test surface covers the work area. No other application's content is captured.</p><div id="count">Clicks: 0</div><script type="module">import {emit} from '@tauri-apps/api/event';let count=0;document.querySelector('button').addEventListener('click',async event=>{document.getElementById('count').textContent=`Clicks: ${++count}`;await emit('source-desktop:probe-click',{count,trusted:event.isTrusted});});</script></body></html>
