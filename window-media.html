<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chunk Surfer</title>
    <style>
      html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010207;user-select:none;touch-action:none}
      body{position:relative;cursor:default}
      canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
      #grip{position:absolute;inset:0 0 auto 0;height:14px;z-index:2;cursor:grab;background:linear-gradient(#b8c8e42b,transparent);border-top:1px solid #d6e6ff70}
      #grip:active{cursor:grabbing}
      #fallback{position:absolute;inset:0;display:none;object-fit:cover;width:100%;height:100%;image-rendering:pixelated;filter:contrast(1.15) saturate(.72) hue-rotate(12deg)}
    </style>
  </head>
  <body><canvas id="media"></canvas><img id="fallback" alt=""><div id="grip" aria-label="Drag fragment"></div><script type="module" src="/src/window-media-surface.js"></script></body>
</html>
