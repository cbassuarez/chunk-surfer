[package]
name = "chunk-surfer"
version = "0.3.0"
description = "Chunk Surfer desktop shell"
authors = ["cbassuarez"]
edition = "2021"

[lib]
name = "chunk_surfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.7"
libc = "0.2"
libloading = "0.8"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"] }

# Release links through rustc's LTO path, which consumes the workspace rlib
# itself instead of handing the archive to the MSVC linker. Recent link.exe
# revisions (14.44+) reject the freshly written chunk_surfer_lib.rlib on the
# release runners (LNK4003), and the LTO path sidesteps that handoff.
[profile.release]
lto = "thin"
