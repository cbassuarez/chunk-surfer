  - generic [ref=f28e32]:
    - paragraph [ref=f28e33]: The tower is occupied
    - heading "Waiting, bracing, sitting, looking up." [level=2] [ref=f28e34]
    - generic [ref=f28e35]:
      - generic [ref=f28e36]:
        - paragraph [ref=f28e37]: Thirty-four figures occupy the ground level, ten the loft and crossing margins, and six the belfry masonry. Their poses and attention vary. The central nave and carry axis, spiral mouths, narrow triforium, lesson recesses, bell sweep, hatch and arrival remain clear.
        - paragraph [ref=f28e38]: The dedicated models have shoulders, necks, hands, bent joints and uneven weight. Seated bodies meet the existing bench height. The figures are world-anchored shadow and residual energy, held in place through the established illuminated, torch and barely visible unlit states.
      - generic [ref=f28e39]:
        - paragraph [ref=f28e40]: "They remain entirely silent. The building carries the sound: wind at an opening, wood taking load, iron making contact, and bronze when an existing contact or combat event actually strikes it."
        - paragraph [ref=f28e41]: Every figure enters the ordinary depth/material pipeline and final dither. They add no collision, interactions, light slots or shadow maps. Recording, playback, actor suppression, effects-off and ending protections apply; reduced dread preserves the bodies.
        - paragraph [ref=f28e42]: "Dedicated four-pose pack: 311,784 bytes · 13,264 asset triangles. These figures share four meshes; that asset count is not the total visible triangle cost of fifty instances."
    - paragraph [ref=f28e43]: Final figure captures and the repeated descent with the expanded population are being recorded. The ordinary-route photographs in this report show the completed architectural treatment before that addition.
  - generic [ref=f28e44]:
    - paragraph [ref=f28e45]: The built treatment
    - heading "The frame explains the weight." [level=2] [ref=f28e46]
    - generic [ref=f28e47]:
      - generic [ref=f28e48]:
        - heading "Above" [level=3] [ref=f28e49]
        - paragraph [ref=f28e50]: Eight hollow castings have soundbows, visible wall thickness, canons and headstocks. Grooved wooden wheels, individual clappers, stays and sliders retain their existing articulated motion. Scale-aware bearing housings meet the gudgeons; the supporting timber now sits below those axes.
        - paragraph [ref=f28e51]: Iron straps, fixings, joint faces and handled surfaces articulate the apparatus. The deck, guard, hatch and perimeter still describe the same physical route. Four legacy beams that crossed the bearing axes were replaced; the rest of the original architectural geometry and normals remain.
      - generic [ref=f28e52]:
        - heading "Below" [level=3] [ref=f28e53]
        - paragraph [ref=f28e54]: Larger paving establishes the floor. Carved pews and choir stalls, a hollow font, a heavy altar, an abraded monument, a recumbent stone tomb and a pierced pulpitum give the church specific mass and construction. Removed-object traces and surviving ornament carry its stripped history.
        - paragraph [ref=f28e55]: Deep inward stone splays frame cold, closed glazing. These faces remain against the existing solid walls; they create no new openings or through-views. Quieter broad materials let the final dither retain architectural depth while bronze edges and carved forms carry detail.
