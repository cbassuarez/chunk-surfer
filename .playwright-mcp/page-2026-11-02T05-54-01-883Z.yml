                - paragraph [ref=f15e592]: CHUNK SURFER / INSTALLATION
                - paragraph [ref=f15e593]:
                  - strong [ref=f15e594]: INSTALL THE BETA.
                - paragraph [ref=f15e595]: v0.3.0 PUBLIC BETA · UNSIGNED
                - paragraph [ref=f15e596]: Choose the package for your computer. Follow the steps below.
