                    - text: from Applications. If macOS blocks it, open
                    - strong [ref=f15e620]: System Settings → Privacy & Security
                    - text: and use
                    - strong [ref=f15e621]: Open Anyway
                    - text: for Chunk Surfer, then confirm the launch.
                  - listitem [ref=f15e622]: If you enable microphone input, also allow access in the macOS permission prompt. You can continue playing if you decline.
                - heading "Windows" [level=2] [ref=f15e623]
                - list [ref=f15e624]:
