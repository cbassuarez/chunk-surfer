                    - strong [ref=f15e610]: audio
                    - text: Headphones recommended. A microphone is optional.
                - paragraph [ref=f15e611]: These beta packages are unsigned, so your operating system may block the first launch. Use the approval steps below for the copy you downloaded from this page. Download sizes appear beside each file.
                - heading "macOS" [level=2] [ref=f15e612]
                - list [ref=f15e613]:
                  - listitem [ref=f15e614]:
                    - text: Open the downloaded macOS Apple Silicon
