                    - text: from your applications menu.
                - paragraph [ref=f15e644]: The game needs working 3D graphics support. If you see a blank or incorrectly rendered world, include your GPU and graphics-driver details in a bug report. Compatibility and performance on additional hardware are still being tested.
                - heading "Controls" [level=2] [ref=f15e645]
