                - generic [ref=f15e374]:
                  - paragraph [ref=f15e375]: AUDIOCORP / WORK ORDER 4417-C
                  - generic [ref=f15e376]:
                    - paragraph [ref=f15e377]:
                      - strong [ref=f15e379]: TAKE THE JOB.
                    - paragraph [ref=f15e380]: Report to condemned Ellery Conservatory as the field recordist. Capture five clean room tones before demolition at 06:00.
                - generic [ref=f15e381]:
                  - link [ref=f15e382]:
                    - /url: https://img.itch.zone/aW1hZ2UvNDc2ODg3MC8zMTcxMjYxOS5qcGc=/original/9tNIpz.jpg
                    - img "Columns and stairs frame suspended cabinets inside looping structures above an orange horizon." [ref=f15e383] [cursor=pointer]
                  - paragraph [ref=f15e384]: FIND A WAY THROUGH.
                - generic [ref=f15e385]:
                  - paragraph [ref=f15e386]: 01 / FIELD CAPTURE
                  - generic [ref=f15e387]:
                    - heading "ARRIVE. LISTEN. RECORD." [level=2] [ref=f15e388]
                    - paragraph [ref=f15e389]:
                      - text: Step out of the van. Check in. Choose your equipment and bring a light. Open the room in your headphones, check the level, then press
                      - strong [ref=f15e390]: REC
                      - text: and hold still. Keep your footsteps, handling, and breath off the take. Press
                      - strong [ref=f15e391]: STOP
                      - text: when it is usable. Open
                      - strong [ref=f15e392]: TAKES
                      - text: to hear what came back.
                    - paragraph [ref=f15e393]: Mind the torch battery. Keep the beam and your noise off anything you would rather leave alone.
                - generic [ref=f15e394]:
                  - link [ref=f15e395]:
                    - /url: https://img.itch.zone/aW1hZ2UvNDc2ODg3MC8zMTcxMjYxNS5qcGc=/original/F3mu%2Fa.jpg
                    - img "The field recorder shows its tape counter, level display, and REC, STOP, and TAKES controls beside a navigator map and room-level LCD." [ref=f15e396] [cursor=pointer]
                  - paragraph [ref=f15e397]: OPEN THE RECORDER. CHECK THE ROOM.
                - generic [ref=f15e398]:
                  - paragraph [ref=f15e399]: 02 / ENCOUNTERS
                  - generic [ref=f15e400]:
                    - heading "READ THE MOVE. ANSWER." [level=2] [ref=f15e401]
                    - paragraph [ref=f15e402]:
                      - text: Patch your techniques before the encounter.
                      - strong [ref=f15e403]: EXPOSE
                      - text: what hides.
                      - strong [ref=f15e404]: MONITOR
                      - text: a broadcast, capture it, then use
                      - strong [ref=f15e405]: PLAYBACK
                      - text: .
                      - strong [ref=f15e406]: HOLD
                      - text: against a blow or time a parry to turn it back. Earn another action with a good read. Watch the battery and your composure.
                - generic [ref=f15e407]:
                  - paragraph [ref=f15e408]: 03 / PEOPLE AND RECORDS
                  - generic [ref=f15e409]:
                    - heading "TALK. READ. CALL." [level=2] [ref=f15e410]
                    - paragraph [ref=f15e411]: Go across the road. Speak to the people keeping the pub warm. Help with an errand. Meet the people still occupying the school. Ask about a performance. Read the retained records. Follow the letters and phone calls. Hear what has been left out of the account, including your own.
                - generic [ref=f15e412]:
                  - link [ref=f15e413]:
                    - /url: https://img.itch.zone/aW1hZ2UvNDc2ODg3MC8zMTcxMjYxNC5qcGc=/original/oOt8l3.jpg
                    - img "The view from the van looks past its dashboard and windscreen toward Ellery's gate and the buildings across the street." [ref=f15e414] [cursor=pointer]
                  - paragraph [ref=f15e415]: STEP OUT. CHECK IN.
                - generic [ref=f15e416]:
                  - paragraph [ref=f15e417]: 04 / ONWARD AND RETURN
                  - generic [ref=f15e418]:
                    - heading "KEEP GOING. KEEP LISTENING." [level=2] [ref=f15e419]
                    - paragraph [ref=f15e420]: Climb through instruments large enough to become buildings. Cross rooms joined at impossible angles. Find the next landing. Take the wheel and drive into the storm.
                    - paragraph [ref=f15e421]: Sit with a performance. Let the conversation run. Hear the hands, the mistakes, and the space after a note. Decide how long to remain. Get up while you still can.
                    - paragraph [ref=f15e422]:
                      - text: Choose what to carry out. Reach an ending and check
                      - strong [ref=f15e423]: ARCHIVE / 100%
                      - text: for discoveries and filed returns. Finish a run; if it qualifies, play through that same night from another side.
                - generic [ref=f15e424]:
                  - link [ref=f15e425]:
                    - /url: https://img.itch.zone/aW1hZ2UvNDc2ODg3MC8zMTcxMjYxNy5qcGc=/original/uMkj4D.jpg
                    - img "A narrow walking route passes beneath the strings and wooden structure of an enormous harpsichord." [ref=f15e426] [cursor=pointer]
                  - paragraph [ref=f15e427]: FIND THE NEXT LANDING.
                - generic [ref=f15e428]:
