            - heading "Microphone" [level=2] [ref=e175]
            - paragraph [ref=e176]:
              - text: The game asks for microphone permission on first launch.
              - strong [ref=e177]: You can say no and finish the whole game.
            - paragraph [ref=e178]: If you allow it, the game measures loudness in your room locally while a take is rolling, so real noise can contaminate a recording or provoke a response in the building. Audio is never recorded, stored, transmitted, uploaded, or played back through the game. Permission can be revoked at any time in your operating system's privacy settings, or in the game's own audio settings.
