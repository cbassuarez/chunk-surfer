            - paragraph [ref=e17]: ELLERY HOLDINGS ORDER 4417-C
            - paragraph [ref=e18]:
              - strong [ref=e19]: Five rooms. Five clean takes and you’re done… or so you think.
            - paragraph [ref=e20]: Record the sound of empty rooms in a condemned conservatory. Stay still. Stay silent. Finish before demolition begins.
            - blockquote [ref=e21]:
              - text: WORK ORDER ·SOURCE 4417-C
              - paragraph [ref=e22]:
                - strong [ref=e23]: site
                - generic [ref=e24]: Ellery Conservatory of Music. Condemned.
              - paragraph [ref=e25]:
                - strong [ref=e26]: deliver
                - generic [ref=e27]: Five clean room-tone recordings.
              - paragraph [ref=e28]:
                - strong [ref=e29]: window
                - generic [ref=e30]: One night. Demolition begins at 06:00.
              - paragraph [ref=e31]:
                - strong [ref=e32]: rules
                - generic [ref=e33]: If you can hear yourself on the take, the take is not the room.
            - paragraph [ref=e34]: "● ACCOUNT OPEN: CONTRACTOR PRESENT"
            - separator [ref=e35]
            - paragraph [ref=e36]: 01 / CASE — first person audio-reactive horror
            - heading "The job is to record nothing." [level=2] [ref=e37]
            - paragraph [ref=e38]:
              - emphasis [ref=e39]: Chunk Surfer
              - text: is a short first-person psychological horror game about sound recording. As a field recordist in the condemned Ellery Conservatory, your job is to capture five clean room sounds as you evade invisible entities, confront your murky past, and figure out what happened to the previous recordist who tried to do this gig first.
            - paragraph [ref=e40]: Monitor each space, roll the recorder, then stay still and silent – or, rather, vulnerable – for a whole minute. Movement or noise can invalidate the take. An optional computer microphone adds noise from your real room through local loudness analysis only; audio is never recorded or uploaded.
            - paragraph [ref=e41]: 02 / MATERIAL — authored PBR and native distortion
            - heading "A building that will not stay still." [level=2] [ref=e42]
            - paragraph [ref=e43]:
              - emphasis [ref=e44]: Chunk Surfer
              - text: builds its unstable world from authored PBR materials, native lighting, and deliberately unsettling image treatment. The experimental local Stable Diffusion lens remains development-only, outside the downloadable game.
            - paragraph [ref=e45]:
              - strong [ref=e46]: "Under the hood:"
              - text: the game renders authored textures inside its own 3D scene and combines them with native dither, pixel-mesh, and other graphic effects. No local AI model is required to play.
            - paragraph [ref=e47]: The result is a deliberately unstable low-resolution look, with authored surfaces, native lighting and dithered graphic effects.
            - paragraph [ref=e48]: Geometry, lighting, depth, movement, and UI remain native, with the rendering effects operating entirely in the game.
            - paragraph [ref=e49]: 03 / FIELD — listen. record. do not move.
            - heading "Your movement betrays you." [level=2] [ref=e50]
            - paragraph [ref=e51]: Monitor each assigned space before committing to a take. Once the recorder rolls, light and movement become liabilities. A clean recording advances the work order. A contaminated one must be attempted again, and a loud mistake can give whatever else is in the building someone to follow.
            - paragraph [ref=e52]: Your torch makes the conservatory visible but its battery is finite and its beam attracts attention. Footsteps, handling, and injuries make noise. Corridors outside your sight and hearing can change, so a remembered route may not remain the route you return to.
            - paragraph [ref=e53]: 04 / RECORD — redaction turn-based combat
            - heading "Pick up the pieces." [level=2] [ref=e54]
            - paragraph [ref=e55]: "Inspect the packet left by the previous contractor and play back what your recorder captured. Later encounters turn transcript redaction into a physical struggle: choose what to black out, protect what remains readable, and live with the record you produce."
            - blockquote [ref=e56]:
              - paragraph [ref=e57]: a game of redaction. black out the words that change your reality to favorable odds.
            - paragraph [ref=e58]: 05 / SOURCE — source space
            - heading "The game’s own files become the map." [level=2] [ref=e59]
            - paragraph [ref=e60]: The investigation eventually ruptures into literal source-code space, where the game’s own files become terrain, passages, and surfaces that can be altered. The machinery behind the fiction is not a bonus menu. It is somewhere you go.
            - paragraph [ref=e61]: 06 / INPUT — let your room into the game—or do not
            - heading "Your microphone is optional. Its consequences are not cosmetic." [level=2] [ref=e62]
            - paragraph [ref=e63]:
              - text: When enabled,
              - emphasis [ref=e64]: Chunk Surfer
              - text: measures loudness locally while a take is rolling. Noise in your real room can contaminate a take or provoke an in-game response. It never records, stores, transmits, uploads, or plays back microphone audio.
            - paragraph [ref=e65]: You can deny or revoke permission and complete the game without microphone input.
            - paragraph [ref=e66]: 07 / RELEASE — v0.3.0 candidate
            - heading "Prepared for the next public beta." [level=2] [ref=e67]
            - paragraph [ref=e68]: This copy describes the v0.3.0 candidate and does not announce a published download. Confirm the version, platform checks and actual files before replacing this notice with a release announcement. Save files, settings, performance and packaging may change between beta builds.
