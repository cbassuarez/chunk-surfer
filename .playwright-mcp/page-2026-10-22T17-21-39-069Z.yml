    - paragraph [ref=f1e13]: The bright, even rims in the previous version read too readily as bowls. The rebuilt ears keep their approved size but have deeper canals under a heavy tragus, a forked antihelix, compressed sections of rim and a torn attachment. Cool mottling and dark wet recesses replace uniform pale surfaces. There are no added collisions.
