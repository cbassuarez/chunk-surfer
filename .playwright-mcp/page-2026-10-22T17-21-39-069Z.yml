    - paragraph [ref=f1e21]: "The wall text keeps its words and wall allocations. Round tubular lettering has become pressed pigment: broad and narrow strokes, pooled ends, dry trailing edges, repainting and sparse gravity runs. The large statement carries the reading; the repetitions crowd it."
