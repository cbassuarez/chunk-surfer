    - paragraph [ref=f1e89]: "The 48 apparitions now have a shared purpose: 45 congregants, one celebrant and two acolytes, oriented toward the existing altar. Thirty-six congregants kneel with joined hands; nine remain seated. Uneven shoulders, height and weight remain, while random idle head-turns are removed."
