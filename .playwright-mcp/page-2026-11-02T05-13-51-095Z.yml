            - paragraph [ref=f64e220]:
              - text: The recorder has
              - strong [ref=f64e221]: REC
              - text: ","
              - strong [ref=f64e222]: STOP
              - text: ", and"
              - strong [ref=f64e223]: TAKES
              - text: controls. Opening it does not pause the room. Follow the prompts on the machine when starting a recording or saving a usable take.
            - heading "Microphone and local recordings" [level=2] [ref=f64e224]
            - paragraph [ref=f64e225]: Microphone permission is optional. With permission, the game measures room loudness locally so real noise can affect play. You can also choose to record spoken take slates and voicemail. These recordings stay on your device; the game does not recognize speech or automatically upload audio. You can complete the game without a microphone.
            - paragraph [ref=f64e226]:
              - text: Use
              - strong [ref=f64e227]: Settings → Input
              - text: to select an input and test its level. Operating-system privacy settings control the app’s microphone permission.
            - heading "Local profile and desktop effects" [level=2] [ref=f64e228]
            - paragraph [ref=f64e229]: The separate profile choice permits disclosed local personalization using names, computer details, and in-game responses. Optional desktop effects can move the game window, open additional game-owned windows, and create field-return files in the game’s local data folder. Profile data is processed locally and is not uploaded.
            - paragraph [ref=f64e230]: You can play the complete game with the profile off. Settings let you disable individual modules, restore the game window, and erase the profile data.
            - heading "Content warning and accessibility" [level=2] [ref=f64e231]
            - paragraph [ref=f64e232]: Sustained dread, sudden loud sounds, deliberate jumpscares, flashing lights, and high-contrast patterns. Set your preferred effects before starting.
            - paragraph [ref=f64e233]: Settings include text speed and instant text, flash/strobe and screen-shake reduction, controller configuration, recording forgiveness, navigation help, combat assistance, and escape-timer adjustments.
            - heading "Saved data and uninstalling" [level=2] [ref=f64e234]
            - paragraph [ref=f64e235]:
              - text: Removing the app normally leaves local progress, settings, and recordings on this device. To remove them too, first open
              - strong [ref=f64e236]: Settings → Memory → Erase all data & restart
              - text: in the game and confirm. Wait for the restart, then quit and remove the app or package. Exported copies and operating-system backups are not removed by this reset.
            - heading "Report a problem" [level=2] [ref=f64e237]
            - paragraph [ref=f64e238]: Include the game version, operating system, CPU/GPU, controller model if relevant, and the steps that led to the problem. A diagnostic report from the in-game About/Support panel also helps.
