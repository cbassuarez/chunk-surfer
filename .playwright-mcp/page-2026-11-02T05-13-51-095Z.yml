            - paragraph [ref=f64e20]: CHUNK SURFER / FIELD SERVICES
            - generic [ref=f64e21]:
              - paragraph [ref=f64e22]: AUDIOCORP / WORK ORDER 4417-C
              - generic [ref=f64e23]:
                - paragraph [ref=f64e24]:
                  - strong [ref=f64e25]: TAKE THE JOB.
                - paragraph [ref=f64e26]: Report to Ellery Conservatory as the field recordist. Capture five clean room tones before demolition at 06:00. Carry your kit through the school, its streets, and the places opening beyond them.
                - paragraph [ref=f64e27]: FIRST-PERSON HORROR ADVENTURE · SINGLE PLAYER
            - generic [ref=f64e28]:
              - paragraph [ref=f64e29]: 01 / PREPARATION
              - generic [ref=f64e30]:
                - heading "ARRIVE. UNPACK." [level=2] [ref=f64e31]
                - paragraph [ref=f64e32]: Step out of the van. Check in. Read the work order. Choose your field equipment, fit the kit, and keep the map close. Bring a light.
            - generic [ref=f64e33]:
              - paragraph [ref=f64e34]: 02 / FIELD CAPTURE
              - generic [ref=f64e35]:
                - heading "LISTEN. RECORD." [level=2] [ref=f64e36]
                - paragraph [ref=f64e37]:
                  - text: Bring the room up in your headphones. Check the level. Open the recorder, press
                  - strong [ref=f64e38]: REC
                  - text: ", and hold still. Capture the sound of the room without adding your footsteps, handling, or breath. Watch the machine. Press"
                  - strong [ref=f64e39]: STOP
                  - text: when the take is usable. Open
                  - strong [ref=f64e40]: TAKES
                  - text: to hear what came back.
                - paragraph [ref=f64e41]: Mind the torch battery. Use the light to find your way. Keep the beam and your noise off anything you would rather leave alone.
            - generic [ref=f64e42]:
              - paragraph [ref=f64e43]: 03 / ENCOUNTERS
              - generic [ref=f64e44]:
                - heading "ANSWER THE SIGNAL." [level=2] [ref=f64e45]
                - paragraph [ref=f64e46]:
                  - text: Patch your techniques before the encounter. Read the next move.
                  - strong [ref=f64e47]: EXPOSE
                  - text: what hides.
                  - strong [ref=f64e48]: MONITOR
                  - text: a broadcast. Capture it, then use
                  - strong [ref=f64e49]: PLAYBACK
                  - text: .
                  - strong [ref=f64e50]: HOLD
                  - text: against a blow, or time a parry to turn it back. Earn another action with a good read. Watch the battery and your composure.
            - generic [ref=f64e51]:
              - paragraph [ref=f64e52]: 04 / PEOPLE AND RECORDS
              - generic [ref=f64e53]:
                - heading "TALK. READ. CALL." [level=2] [ref=f64e54]
                - paragraph [ref=f64e55]: Go across the road. Speak to the people keeping the pub warm. Help with an errand. Meet the people still occupying the school. Ask about a performance. Read the retained records. Follow the letters and phone calls. Hear what has been left out of the account, including your own.
            - generic [ref=f64e56]:
              - paragraph [ref=f64e57]: 05 / ONWARD
              - generic [ref=f64e58]:
                - heading "KEEP GOING." [level=2] [ref=f64e59]
                - paragraph [ref=f64e60]: Climb through instruments large enough to become buildings. Cross remembered rooms joined at impossible angles. Find the next landing before choosing a descent. Take the wheel and drive into the storm. Look for a way through.
            - generic [ref=f64e61]:
              - paragraph [ref=f64e62]: 06 / LISTENING
              - generic [ref=f64e63]:
                - heading "SIT DOWN. LISTEN." [level=2] [ref=f64e64]
                - paragraph [ref=f64e65]: Stay with a performance as it unfolds. Let the conversation run. Hear the room, the hands, the mistakes, and the space after a note. Decide how long to remain. Get up while you still can.
            - generic [ref=f64e66]:
              - paragraph [ref=f64e67]: 07 / RETURN
              - generic [ref=f64e68]:
                - heading "CHOOSE WHAT TO CARRY OUT." [level=2] [ref=f64e69]
                - paragraph [ref=f64e70]:
                  - text: Keep what you find. Decide what to leave. Reach an ending and check
                  - strong [ref=f64e71]: ARCHIVE / 100%
                  - text: for discoveries and filed returns. Finish a run; if it qualifies, play through that same night from another side.
            - generic [ref=f64e72]:
              - paragraph [ref=f64e73]: BEFORE YOU PLAY
              - generic [ref=f64e74]:
                - heading "SET THE INPUT." [level=2] [ref=f64e75]
                - paragraph [ref=f64e76]: MICROPHONE OPTIONAL · LOCAL PROFILE OPTIONAL
                - paragraph [ref=f64e77]: Microphone permission is optional. With permission, room loudness is measured locally and noise can affect play. You can also choose to record spoken take slates and voicemail; those recordings stay on your device. There is no speech recognition or automatic audio upload.
                - paragraph [ref=f64e78]: A separate optional profile permits disclosed local personalization using names, computer details, and in-game responses. Optional desktop effects can move the game window, open additional game-owned windows, and create field-return files in the game's local data folder. The complete game remains available without microphone input or profiling.
                - paragraph [ref=f64e79]:
                  - text: Open
                  - strong [ref=f64e80]: SETTINGS
                  - text: to adjust text speed, flashes, screen shake, controller bindings, recording forgiveness, navigation help, combat assistance, and escape timers. Use keyboard and mouse or a controller for normal play. Disable profile modules, restore the window, or erase profile data in Settings.
                - heading "CONTENT WARNING" [level=2] [ref=f64e81]
                - paragraph [ref=f64e82]: Sustained dread, sudden loud sounds, deliberate jumpscares, flashing lights, and high-contrast patterns. Visual effects can be reduced in Settings. Optional desktop effects may move the game window and open additional windows.
