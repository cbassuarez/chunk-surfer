        - textbox [ref=f6e451]: "/* Generated by scripts/build-storefront-skin.py from exact production Canvas exports and glyph ROM. See docs/media/storefront/provenance.json for geometry and static transport limits. */ @font-face{font-family:\"ChunkVFD\";src:url(\"data:font/woff;base64,\") format(\"woff\");font-style:normal;font-weight:400;font-display:swap;} @font-face{font-family:\"ChunkLCD\";src:url(\"data:font/woff;base64,\") format(\"woff\");font-style:normal;font-weight:400;font-display:swap;} @font-face{font-family:\"Hardware Sans\";src:url(\"data:font/otf;base64,\") format(\"opentype\");font-style:normal;font-weight:400;font-display:swap;} @font-face{font-family:\"Hardware Sans\";src:url(\"data:font/otf;base64,\") format(\"opentype\");font-style:normal;font-weight:600 700;font-display:swap;} #wrapper{ --cs-plate-image:url(\"data:image/webp;base64,\"); --cs-glass-image:url(\"data:image/webp;base64,\"); --cs-glass-cover:url(\"data:image/webp;base64,\"); --cs-annunciator-image:url(\"data:image/webp;base64,\"); --cs-lcd-image:url(\"data:image/webp;base64,\"); --cs-cap-white:url(\"data:image/webp;base64,\"); --cs-cap-white-pressed:url(\"data:image/webp;base64,\"); --cs-cap-amber:url(\"data:image/webp;base64,\"); --cs-cap-amber-pressed:url(\"data:image/webp;base64,\"); --cs-cap-red:url(\"data:image/webp;base64,\"); --cs-cap-red-pressed:url(\"data:image/webp;base64,\"); } /* CHUNK SURFER — production instrument assets, proposed composition. * Paste target: itch.io → Theme → Custom CSS. Native itch actions remain native. * Root-owned asset generation appends data-URI variables and the ChunkVFD font * to this file before publication. No external CSS imports or texture copies. * * Material variables contain literal exports from the production renderer: * --cs-plate-image, --cs-glass-image, --cs-glass-cover, * --cs-annunciator-image, --cs-lcd-image, * --cs-cap-white, --cs-cap-white-pressed, --cs-cap-amber, * --cs-cap-amber-pressed, --cs-cap-red, --cs-cap-red-pressed. * Plate/glass use 32px source slices; corners do not stretch with the prose. * Controls use the same fixed image box at rest and while physically pressed. * No filters on world captures, decorative live values, flicker or page overlays. */ #wrapper { --cs-print:\"Hardware Sans\",Arial,Helvetica,system-ui,sans-serif; --cs-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,\"Liberation Mono\",monospace; --cs-display:\"ChunkVFD\",ui-monospace,monospace; --cs-field:#050807; --cs-glass:#08110b; --cs-body:#d4dcc8; --cs-bright:#e9eddd; --cs-muted:#a9b99d; --cs-amber:#f2a81e; --cs-lcd-ink:#1c3424; --cs-rule:#354331; --cs-focus:#e8d5a0; --itchio_link_color:#d9dbaa; --itchio_button_color:#bdbda9; --itchio_button_fg_color:#172015; --itchio_button_border_color:#445039; --itchio_button_hover_color:#d3cfae; --itchio_button_active_color:#abae8f; --itchio_button_shadow_color:transparent; --itchio_border_color:#354331; --itchio_border_radius:2px; background:var(--cs-field);color:var(--cs-body);font-family:var(--cs-print); -webkit-font-smoothing:antialiased; } #wrapper #inner_column {background:var(--cs-field);color:var(--cs-body);border:0;border-radius:0;box-shadow:none;font-family:var(--cs-print);} /* Supply a single captured title display; retain a legible native fallback. */ #wrapper #header {padding:24px 20px;background:var(--cs-field);border:0;box-shadow:none;} #wrapper #header h1.game_title {margin:0;color:var(--cs-amber);font:400 clamp(28px,5vw,48px)/1.15 var(--cs-display);letter-spacing:.025em;text-transform:uppercase;} #wrapper #header.has_image {padding:0;} #wrapper #header.has_image img {display:block;width:100%;max-width:100%;height:auto;border:0;border-radius:0;filter:none;} /* Each section is a real faceplate around a separate, recessed glass aperture. */ #wrapper .custom-panel, #wrapper .header_buy_row, #wrapper .custom-download-instrument { box-sizing:border-box;min-width:0;margin:0 0 24px;padding:6px 8px 12px; border:20px solid #7c8572; border-image-source:var(--cs-plate-image,none); border-image-slice:32 fill;border-image-width:20px;border-image-repeat:stretch; background-color:#8d9683;border-radius:0;box-shadow:none; } #wrapper .custom-glass, #wrapper .header_buy_row .buy_row { box-sizing:border-box;min-width:0;margin:0;padding:20px 18px 18px; border:12px solid #131e12; border-image-source:var(--cs-glass-image,none); border-image-slice:32 fill;border-image-width:12px;border-image-repeat:stretch; background-color:var(--cs-glass);border-radius:0;box-shadow:none; color:var(--cs-body); } /* The production optical order is well → display content → smoked cover. * This local, transparent exported cover cannot intercept input. Hardware * controls sit above it, just as they do in the game renderer's hardware layer. */ #wrapper .custom-glass {position:relative;isolation:isolate;} #wrapper .custom-glass::after { content:\"\";position:absolute;inset:0;z-index:1;pointer-events:none; background-image:var(--cs-glass-cover,none); background-size:100% 100%;background-repeat:no-repeat; } #wrapper .custom-glass .button, #wrapper .custom-glass .buy_btn, #wrapper .custom-glass .download_btn, #wrapper .custom-glass .donate_btn, #wrapper .custom-glass .custom-annunciator, #wrapper .custom-glass .custom-lcd, #wrapper .custom-glass kbd {position:relative;z-index:2;} #wrapper .custom-panel > .custom-annunciator { display:table;box-sizing:border-box;max-width:100%;min-height:26px; margin:0 0 15px;padding:6px 11px; background-color:#a6b58d;background-image:var(--cs-annunciator-image,none); background-size:100% 100%;background-repeat:no-repeat; color:#172017;font:700 10px/1.5 var(--cs-print);letter-spacing:.075em; text-transform:uppercase;text-shadow:none; } #wrapper .custom-annunciator { color:var(--cs-amber);font:400 12px/1.5 var(--cs-display); letter-spacing:.03em;text-transform:uppercase; } #wrapper .custom-vfd, #wrapper .formatted_description h2.custom-vfd, #wrapper .user_formatted h2.custom-vfd { margin:0 0 19px;color:var(--cs-amber); font:400 clamp(22px,2.5vw,29px)/1.3 var(--cs-display); letter-spacing:0;text-transform:uppercase;text-shadow:0 0 4px rgba(242,168,30,.16); } #wrapper .custom-lcd { display:table;box-sizing:border-box;max-width:100%;margin:15px 0 18px;padding:10px 13px; border:2px solid #53654c;border-top-color:#33492f;border-bottom-color:#b2c29b; background-color:#aebf9b;background-image:var(--cs-lcd-image,none); background-size:100% 100%;background-repeat:no-repeat; color:var(--cs-lcd-ink);font:400 12px/1.55 var(--cs-print);letter-spacing:.035em; text-transform:uppercase;text-shadow:none;box-shadow:none; } #wrapper .custom-lcd strong, #wrapper .custom-lcd a {color:var(--cs-lcd-ink);} /* The genuine itch CTA uses the exact exported cap and fixed retainer. */ #wrapper .header_buy_row {margin-top:24px;} #wrapper .header_buy_row > p { display:table;max-width:100%;margin:0 0 13px;padding:7px 11px; background-color:#aebf9b;background-image:var(--cs-lcd-image,none); background-size:100% 100%;color:var(--cs-lcd-ink); font:400 11px/1.6 var(--cs-print);letter-spacing:.04em;text-transform:uppercase; } #wrapper .header_buy_row .buy_row {padding:13px 14px 10px;} #wrapper .button, #wrapper .buy_btn, #wrapper .download_btn, #wrapper .donate_btn { display:inline-block;box-sizing:border-box;position:relative; min-height:54px;height:auto;max-width:100%;margin:3px 3px 7px;padding:18px 23px; border:0;border-radius:0;background-color:#bdbda9; background-image:var(--cs-cap-white,none);background-size:100% 100%;background-repeat:no-repeat; box-shadow:none;color:#172015;font:700 12px/1.35 var(--cs-print); letter-spacing:.035em;text-transform:uppercase;text-align:center; text-decoration:none;text-shadow:none;white-space:normal;vertical-align:middle;cursor:pointer; } #wrapper .buy_btn:not(.download_btn), #wrapper .donate_btn {background-image:var(--cs-cap-red,none);} #wrapper .header_buy_row .button, #wrapper .header_buy_row .download_btn, #wrapper .custom-download-instrument .download_btn {background-image:var(--cs-cap-amber,none);} #wrapper .button:hover, #wrapper .buy_btn:hover, #wrapper .download_btn:hover, #wrapper .donate_btn:hover {color:#172015;text-decoration:none;text-shadow:none;} #wrapper .button:active, #wrapper .download_btn:active {background-image:var(--cs-cap-white-pressed,var(--cs-cap-white,none));} #wrapper .buy_btn:not(.download_btn):active, #wrapper .donate_btn:active {background-image:var(--cs-cap-red-pressed,var(--cs-cap-red,none));} #wrapper .header_buy_row .button:active, #wrapper .header_buy_row .download_btn:active, #wrapper .custom-download-instrument .download_btn:active {background-image:var(--cs-cap-amber-pressed,var(--cs-cap-amber,none));} /* Mechanical focus index, plus an unmistakable keyboard focus outline. */ #wrapper .button:focus-visible, #wrapper .buy_btn:focus-visible, #wrapper .download_btn:focus-visible, #wrapper .donate_btn:focus-visible, #wrapper a:focus-visible {outline:2px solid var(--cs-focus);outline-offset:4px;} #wrapper .buy_message {display:inline-block;margin:3px 8px;color:#c7d5bb;font:12px/1.6 var(--cs-print);vertical-align:middle;} #wrapper .buy_message .dollars {color:#e9d7a6;font-weight:700;} #wrapper .buy_message .sub {color:var(--cs-muted);} /* Reading copy stays inside the source glass. Print and display roles differ. */ #wrapper .formatted_description, #wrapper .user_formatted {color:var(--cs-body);font-family:var(--cs-print);font-size:16px;line-height:1.7;overflow-wrap:break-word;} #wrapper .formatted_description p, #wrapper .user_formatted p {max-width:66ch;margin:0 0 1.15em;} #wrapper .formatted_description a, #wrapper .user_formatted a {color:#d9dbaa;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;} #wrapper .formatted_description a:hover, #wrapper .user_formatted a:hover {color:#eef0ce;text-decoration-thickness:2px;} #wrapper .formatted_description strong, #wrapper .user_formatted strong {color:var(--cs-bright);font-weight:700;} #wrapper .formatted_description em, #wrapper .user_formatted em {color:inherit;} #wrapper .formatted_description h2, #wrapper .user_formatted h2 {max-width:37ch;margin:1.8em 0 .65em;color:var(--cs-amber);font:400 24px/1.3 var(--cs-display);letter-spacing:0;text-transform:uppercase;} #wrapper .formatted_description h3, #wrapper .user_formatted h3 {color:var(--cs-bright);font:600 17px/1.4 var(--cs-print);} #wrapper .formatted_description hr, #wrapper .custom-break {max-width:66ch;margin:2em 0;height:0;border:0;border-top:1px solid var(--cs-rule);background:none;} #wrapper .custom-index {max-width:66ch;margin:2em 0 .7em;padding-top:11px;border-top:1px solid var(--cs-rule);color:var(--cs-muted);font:600 10px/1.6 var(--cs-print);letter-spacing:.08em;text-transform:uppercase;} #wrapper .custom-index:first-child {margin-top:0;padding-top:0;border-top:0;} #wrapper .custom-index + h2 {margin-top:.5em;} #wrapper .custom-lede {color:var(--cs-amber);font:400 clamp(23px,2.5vw,30px)/1.35 var(--cs-display);letter-spacing:0;text-transform:uppercase;} #wrapper .custom-lede strong {color:inherit;font-weight:400;} #wrapper .custom-signoff {color:var(--cs-bright);font-size:17px;} #wrapper .custom-signoff strong {color:inherit;} #wrapper h2.custom-closer {font:400 25px/1.35 var(--cs-display);} #wrapper .custom-notice, #wrapper .custom-action-note {color:var(--cs-muted);font-size:13px;line-height:1.7;} #wrapper .custom-status {color:#c5d7b5;font:400 12px/1.7 var(--cs-display);letter-spacing:.02em;} #wrapper .custom-workorder {max-width:66ch;margin:1.7em 0;padding:0 0 0 14px;border:0;border-left:1px solid #63724f;background:transparent;quotes:none;} #wrapper .custom-workorder p {display:grid;grid-template-columns:6em minmax(0,1fr);gap:0 1em;max-width:none;margin:0;padding:6px 0;font-size:14px;line-height:1.6;} #wrapper .custom-workorder .custom-label {color:var(--cs-muted);font:600 11px/1.9 var(--cs-print);letter-spacing:.05em;text-transform:uppercase;} #wrapper .custom-workorder .custom-value {color:var(--cs-body);} #wrapper .custom-q