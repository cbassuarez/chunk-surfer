            - heading "Install instructions" [level=2] [ref=f6e182]
            - generic [ref=f6e183]:
              - paragraph [ref=f6e184]: CHUNK SURFER / INSTALLATION
              - paragraph [ref=f6e185]:
                - strong [ref=f6e186]: INSTALL THE BETA.
              - paragraph [ref=f6e187]: v0.3.0 PUBLIC BETA · UNSIGNED
              - paragraph [ref=f6e188]: Choose the package for your computer. Follow the steps below.
              - list [ref=f6e189]:
                - listitem [ref=f6e190]:
                  - strong [ref=f6e191]: macOS
                  - generic [ref=f6e192]: Apple Silicon · DMG
                - listitem [ref=f6e193]:
                  - strong [ref=f6e194]: windows
                  - generic [ref=f6e195]:
                    - text: x64 ·
                    - code [ref=f6e196]: chunk-surfer-windows-x64.zip
                    - text: · Microsoft Edge WebView2 Runtime required
                - listitem [ref=f6e197]:
                  - strong [ref=f6e198]: linux
                  - generic [ref=f6e199]:
                    - text: x64 ·
                    - code [ref=f6e200]: chunk-surfer-linux-x64.AppImage
                    - text: or
                    - code [ref=f6e201]: chunk-surfer-linux-x64.deb
                - listitem [ref=f6e202]:
                  - strong [ref=f6e203]: audio
                  - generic [ref=f6e204]: Headphones recommended. A microphone is optional.
              - paragraph [ref=f6e205]: These beta packages are unsigned, so your operating system may block the first launch. Use the approval steps below for the copy you downloaded from this page. Download sizes appear beside each file.
              - heading "macOS" [level=2] [ref=f6e206]
              - list [ref=f6e208]:
                - listitem [ref=f6e209]:
                  - text: Open the downloaded macOS Apple Silicon
                  - code [ref=f6e210]: .dmg
                  - text: and drag
                  - strong [ref=f6e211]: Chunk Surfer
                  - text: into
                  - strong [ref=f6e212]: Applications
                  - text: .
                - listitem [ref=f6e213]:
                  - text: Launch
                  - strong [ref=f6e214]: Chunk Surfer
                  - text: from Applications. If macOS blocks it, open
                  - strong [ref=f6e215]: System Settings → Privacy & Security
                  - text: and use
                  - strong [ref=f6e216]: Open Anyway
                  - text: for Chunk Surfer, then confirm the launch.
                - listitem [ref=f6e217]: If you enable microphone input, also allow access in the macOS permission prompt. You can continue playing if you decline.
              - heading "Windows" [level=2] [ref=f6e218]
              - list [ref=f6e220]:
                - listitem [ref=f6e221]:
                  - text: Extract
                  - code [ref=f6e222]: chunk-surfer-windows-x64.zip
                  - text: completely into a folder you can write to.
                - listitem [ref=f6e223]:
                  - text: Keep all extracted files together and run
                  - code [ref=f6e224]: chunk-surfer.exe
                  - text: . Do not launch it from inside the ZIP.
                - listitem [ref=f6e225]:
                  - text: The
                  - strong [ref=f6e226]: Microsoft Edge WebView2 Runtime
                  - text: must be installed. If it is missing, install it from Microsoft and launch the game again.
                - listitem [ref=f6e227]:
                  - text: If SmartScreen shows
                  - emphasis [ref=f6e228]: Windows protected your PC
                  - text: ", use"
                  - strong [ref=f6e229]: More info → Run anyway
                  - text: for this downloaded beta.
              - heading "Linux" [level=2] [ref=f6e230]
              - list [ref=f6e232]:
                - listitem [ref=f6e233]:
                  - strong [ref=f6e234]: "AppImage:"
                  - text: "make the file executable and run it:"
                  - code [ref=f6e235]: chmod +x chunk-surfer-linux-x64.AppImage
                  - code [ref=f6e236]: ./chunk-surfer-linux-x64.AppImage
                - listitem [ref=f6e237]:
                  - strong [ref=f6e238]: "Debian / Ubuntu:"
                  - text: install with
                  - code [ref=f6e239]: sudo apt install ./chunk-surfer-linux-x64.deb
                  - text: ", then open"
                  - strong [ref=f6e240]: Chunk Surfer
                  - text: from your applications menu.
              - paragraph [ref=f6e241]: The game needs working 3D graphics support. If you see a blank or incorrectly rendered world, include your GPU and graphics-driver details in a bug report. Compatibility and performance on additional hardware are still being tested.
              - heading "Controls" [level=2] [ref=f6e242]
              - paragraph [ref=f6e244]: "Keyboard and mouse or a controller can be used for normal play. Controller buttons can be remapped in Settings. These are the default on-foot keyboard controls; driving and other scenes show their own prompts:"
              - table [ref=f6e245]:
