                  - text: ", and then double-click it."
                - heading "LINUX (DEBIAN PACKAGE)" [level=3] [ref=f18e668]
                - paragraph [ref=f18e669]:
                  - text: The
                  - code [ref=f18e670]: .deb
                  - text: package is intended for Ubuntu, Debian, and compatible Debian-based distributions.
                - paragraph [ref=f18e671]: "Install it by opening the downloaded package in your software installer, or run:"
                - generic [ref=f18e672]: sudo apt install ./chunk-surfer*.deb
                - paragraph [ref=f18e673]: After installation, launch Chunk Surfer from your application menu.
                - paragraph [ref=f18e674]: Players using another Linux distribution should generally choose the AppImage instead.
                - heading "AUDIO" [level=2] [ref=f18e675]
                - paragraph [ref=f18e676]: Headphones are strongly recommended.
                - paragraph [ref=f18e677]: No specific Bluetooth, audio-interface, or sample-rate compatibility problems are currently known. During the beta, please report any device-specific audio issues.
                - paragraph [ref=f18e678]: "When reporting an audio problem, include:"
                - list [ref=f18e679]:
                  - listitem [ref=f18e680]: Operating system and version
                  - listitem [ref=f18e681]: Headphone, speaker, or audio-interface model
                  - listitem [ref=f18e682]: Connection type, such as wired, Bluetooth, USB, or HDMI
                  - listitem [ref=f18e683]: Sample rate, when known
                  - listitem [ref=f18e684]: Whether the problem occurs immediately or after playing for a while
                - heading "CONTROLLERS" [level=2] [ref=f18e685]
                - paragraph [ref=f18e686]: Chunk Surfer supports full controller input as well as keyboard and mouse.
                - paragraph [ref=f18e687]: Controller support can vary by operating system, driver, connection type, and controller model. Please include those details when reporting an input problem.
                - heading "PERMISSIONS" [level=2] [ref=f18e688]
                - paragraph [ref=f18e689]: Chunk Surfer may request optional operating-system permissions.
                - paragraph [ref=f18e690]: These permissions are not required for normal gameplay. You may deny them and continue playing.
                - paragraph [ref=f18e691]: Permissions can be reviewed or changed later through your operating system’s privacy or application settings.
                - heading "SAVING PROGRESS" [level=2] [ref=f18e692]
                - paragraph [ref=f18e693]: Chunk Surfer saves progress automatically to local application data.
                - list [ref=f18e694]:
                  - listitem [ref=f18e695]: There is no manual save button.
                  - listitem [ref=f18e696]: Progress is stored on the current computer.
                  - listitem [ref=f18e697]: Cloud saves are not currently available.
                  - listitem [ref=f18e698]: Saves do not automatically transfer between computers or operating systems.
                  - listitem [ref=f18e699]: Avoid deleting local application data unless you intend to reset your progress.
                - paragraph [ref=f18e700]: Because this is a beta, save compatibility between major builds is not guaranteed. Any update that intentionally resets or changes save data will be identified in the release notes.
                - heading "UPDATING the GAME" [level=2] [ref=f18e701]
                - paragraph [ref=f18e702]: Players using the itch.io desktop app may receive updates through the app when a compatible build is available.
                - paragraph [ref=f18e703]: Players who download directly from the website should return to this page to download new beta releases.
                - paragraph [ref=f18e704]: Unless a release note says otherwise, installing an update over the existing version should preserve local progress. During the beta, keeping a copy of important save data is recommended before installing major updates.
                - heading "TROUBLESHOOTING" [level=2] [ref=f18e705]
                - paragraph [ref=f18e706]: "Before reporting a problem:"
                - list [ref=f18e707]:
                  - listitem [ref=f18e708]: Confirm that you downloaded the correct build for your operating system.
                  - listitem [ref=f18e709]: Restart the game.
                  - listitem [ref=f18e710]: Restart your computer.
                  - listitem [ref=f18e711]: Confirm that your graphics drivers and operating system are current.
                  - listitem [ref=f18e712]: Disconnect unnecessary controllers or audio devices and try again.
                  - listitem [ref=f18e713]: Re-download the build if the installer or archive may be incomplete.
                - paragraph [ref=f18e714]: "When reporting a bug, please include:"
                - list [ref=f18e715]:
                  - listitem [ref=f18e716]: Operating system and version
                  - listitem [ref=f18e717]: Computer model or hardware specifications
                  - listitem [ref=f18e718]:
                    - text: "Download used: Windows, macOS, AppImage, or"
                    - code [ref=f18e719]: .deb
                  - listitem [ref=f18e720]: Game version
                  - listitem [ref=f18e721]: Keyboard/mouse or controller
                  - listitem [ref=f18e722]: What you expected to happen
                  - listitem [ref=f18e723]: What happened instead
                  - listitem [ref=f18e724]: Steps that reproduce the problem
                  - listitem [ref=f18e725]: Screenshot, video, or error message when available
                - paragraph [ref=f18e726]: Thank you for helping test Chunk Surfer.
