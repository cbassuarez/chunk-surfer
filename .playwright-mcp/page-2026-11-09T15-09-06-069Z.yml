            - paragraph [ref=e299]:
              - text: The recorder has
              - strong [ref=e300]: REC
              - text: ","
              - strong [ref=e301]: STOP
              - text: ", and"
              - strong [ref=e302]: TAKES
              - text: controls. Opening it does not pause the room. Follow the prompts on the machine when starting a recording or saving a usable take.
            - heading "Microphone and local recordings" [level=2] [ref=e303]
            - paragraph [ref=e304]: Microphone permission is optional. With permission, the game measures room loudness locally so real noise can affect play. You can also choose to record spoken take slates and voicemail. These recordings stay on your device; the game does not recognize speech or automatically upload audio. You can complete the game without a microphone.
            - paragraph [ref=e305]:
              - text: Use
              - strong [ref=e306]: Settings → Input
              - text: to select an input and test its level. Operating-system privacy settings control the app’s microphone permission.
            - heading "Local profile and desktop effects" [level=2] [ref=e307]
            - paragraph [ref=e308]: The separate profile choice permits disclosed local personalization using names, computer details, and in-game responses. Optional desktop effects can move the game window, open additional game-owned windows, and create field-return files in the game’s local data folder. Profile data is processed locally and is not uploaded.
            - paragraph [ref=e309]: You can play the complete game with the profile off. Settings let you disable individual modules, restore the game window, and erase the profile data.
            - heading "Content warning and accessibility" [level=2] [ref=e310]
            - paragraph [ref=e311]: Sustained dread, sudden loud sounds, deliberate jumpscares, flashing lights, and high-contrast patterns. Set your preferred effects before starting.
            - paragraph [ref=e312]: Settings include text speed and instant text, flash/strobe and screen-shake reduction, controller configuration, recording forgiveness, navigation help, combat assistance, and escape-timer adjustments.
            - heading "Saved data and uninstalling" [level=2] [ref=e313]
            - paragraph [ref=e314]:
              - text: Removing the app normally leaves local progress, settings, and recordings on this device. To remove them too, first open
              - strong [ref=e315]: Settings → Memory → Erase all data & restart
              - text: in the game and confirm. Wait for the restart, then quit and remove the app or package. Exported copies and operating-system backups are not removed by this reset.
            - heading "Report a problem" [level=2] [ref=e316]
            - paragraph [ref=e317]: Include the game version, operating system, CPU/GPU, controller model if relevant, and the steps that led to the problem. A diagnostic report from the in-game About/Support panel also helps.
