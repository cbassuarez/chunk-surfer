          - heading "Install instructions" [level=2] [ref=e203]
          - generic [ref=e204]:
            - paragraph [ref=e205]: CHUNK SURFER / INSTALLATION
            - paragraph [ref=e206]:
              - strong [ref=e207]: INSTALL THE BETA.
            - paragraph [ref=e208]: v0.3.0 PUBLIC BETA · UNSIGNED
            - paragraph [ref=e209]: Choose the package for your computer. Follow the steps below.
            - list [ref=e210]:
              - listitem [ref=e211]:
                - strong [ref=e212]: macOS
                - text: Apple Silicon · DMG
              - listitem [ref=e213]:
                - strong [ref=e214]: windows
                - generic [ref=e215]:
                  - text: x64 ·
                  - code [ref=e216]: chunk-surfer-windows-x64.zip
                  - text: · Microsoft Edge WebView2 Runtime required
              - listitem [ref=e217]:
                - strong [ref=e218]: linux
                - generic [ref=e219]:
                  - text: x64 ·
                  - code [ref=e220]: chunk-surfer-linux-x64.AppImage
                  - text: or
                  - code [ref=e221]: chunk-surfer-linux-x64.deb
              - listitem [ref=e222]:
                - strong [ref=e223]: audio
                - text: Headphones recommended. A microphone is optional.
            - paragraph [ref=e224]: These beta packages are unsigned, so your operating system may block the first launch. Use the approval steps below for the copy you downloaded from this page. Download sizes appear beside each file.
            - heading "macOS" [level=2] [ref=e225]
            - list [ref=e226]:
              - listitem [ref=e227]:
                - text: Open the downloaded macOS Apple Silicon
                - code [ref=e228]: .dmg
                - text: and drag
                - strong [ref=e229]: Chunk Surfer
                - text: into
                - strong [ref=e230]: Applications
                - text: .
              - listitem [ref=e231]:
                - text: Launch
                - strong [ref=e232]: Chunk Surfer
                - text: from Applications. If macOS blocks it, open
                - strong [ref=e233]: System Settings → Privacy & Security
                - text: and use
                - strong [ref=e234]: Open Anyway
                - text: for Chunk Surfer, then confirm the launch.
              - listitem [ref=e235]: If you enable microphone input, also allow access in the macOS permission prompt. You can continue playing if you decline.
            - heading "Windows" [level=2] [ref=e236]
            - list [ref=e237]:
              - listitem [ref=e238]:
                - text: Extract
                - code [ref=e239]: chunk-surfer-windows-x64.zip
                - text: completely into a folder you can write to.
              - listitem [ref=e240]:
                - text: Keep all extracted files together and run
                - code [ref=e241]: chunk-surfer.exe
                - text: . Do not launch it from inside the ZIP.
              - listitem [ref=e242]:
                - text: The
                - strong [ref=e243]: Microsoft Edge WebView2 Runtime
                - text: must be installed. If it is missing, install it from Microsoft and launch the game again.
              - listitem [ref=e244]:
                - text: If SmartScreen shows
                - emphasis [ref=e245]: Windows protected your PC
                - text: ", use"
                - strong [ref=e246]: More info → Run anyway
                - text: for this downloaded beta.
            - heading "Linux" [level=2] [ref=e247]
            - list [ref=e248]:
              - listitem [ref=e249]:
                - strong [ref=e250]: "AppImage:"
                - text: "make the file executable and run it:"
                - code [ref=e251]: chmod +x chunk-surfer-linux-x64.AppImage
                - code [ref=e252]: ./chunk-surfer-linux-x64.AppImage
              - listitem [ref=e253]:
                - strong [ref=e254]: "Debian / Ubuntu:"
                - text: install with
                - code [ref=e255]: sudo apt install ./chunk-surfer-linux-x64.deb
                - text: ", then open"
                - strong [ref=e256]: Chunk Surfer
                - text: from your applications menu.
            - paragraph [ref=e257]: The game needs working 3D graphics support. If you see a blank or incorrectly rendered world, include your GPU and graphics-driver details in a bug report. Compatibility and performance on additional hardware are still being tested.
            - heading "Controls" [level=2] [ref=e258]
            - paragraph [ref=e259]: "Keyboard and mouse or a controller can be used for normal play. Controller buttons can be remapped in Settings. These are the default on-foot keyboard controls; driving and other scenes show their own prompts:"
            - table [ref=e260]:
              - rowgroup [ref=e261]:
