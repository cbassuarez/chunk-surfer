                - heading "Current unsigned-beta notice" [level=4] [ref=f2e234]
                - paragraph [ref=f2e235]: The current beta may not yet be signed and notarized by Apple. macOS may therefore prevent it from opening normally.
                - paragraph [ref=f2e236]: "After attempting to open the game:"
                - list [ref=f2e237]:
                  - listitem [ref=f2e238]:
                    - text: Open
                    - strong [ref=f2e239]: System Settings
                    - text: .
                  - listitem [ref=f2e240]:
                    - text: Select
                    - strong [ref=f2e241]: Privacy & Security
                    - text: .
                  - listitem [ref=f2e242]: Scroll to the Security section.
                  - listitem [ref=f2e243]: Find the message concerning Chunk Surfer.
                  - listitem [ref=f2e244]:
                    - text: Select
                    - strong [ref=f2e245]: Open Anyway
                    - text: .
                  - listitem [ref=f2e246]: Confirm that you want to open the application.
                - paragraph [ref=f2e247]: Only override this warning when the game was downloaded directly from the official Chunk Surfer itch.io page.
                - paragraph [ref=f2e248]: This section will be removed once the macOS release is signed and notarized.
                - heading "LINUX (AppImage)" [level=3] [ref=f2e249]
                - paragraph [ref=f2e250]: The AppImage is the recommended Linux download for most players.
                - paragraph [ref=f2e251]:
                  - strong [ref=f2e252]: Requirements
                - list [ref=f2e253]:
                  - listitem [ref=f2e254]: 64-bit Linux system
                  - listitem [ref=f2e255]: Ubuntu 26.04 LTS or a compatible modern distribution
                  - listitem [ref=f2e256]: 8 GB RAM minimum
                  - listitem [ref=f2e257]: 7.5 GB available storage
                  - listitem [ref=f2e258]: Modern integrated or dedicated graphics hardware
                  - listitem [ref=f2e259]: Current graphics drivers recommended
                - paragraph [ref=f2e260]:
                  - strong [ref=f2e261]: Installation
                - list [ref=f2e262]:
                  - listitem [ref=f2e263]:
                    - text: Download the
                    - code [ref=f2e264]: .AppImage
                    - text: .
                  - listitem [ref=f2e265]: Open a terminal in the download folder.
                  - listitem [ref=f2e266]: "Make the file executable:"
                - generic [ref=f2e267]: chmod +x ./Chunk-Surfer*.AppImage
                - list [ref=f2e268]:
                  - listitem [ref=f2e269]: "Launch the game:"
                - generic [ref=f2e270]: ./Chunk-Surfer*.AppImage
                - paragraph [ref=f2e271]:
                  - text: Many Linux file managers also allow you to right-click the AppImage, open
                  - strong [ref=f2e272]: Properties
                  - text: ", enable"
                  - strong [ref=f2e273]: Allow executing file as program
                  - text: ", and then double-click it."
                - heading "LINUX (DEBIAN PACKAGE)" [level=3] [ref=f2e274]
                - paragraph [ref=f2e275]:
                  - text: The
                  - code [ref=f2e276]: .deb
                  - text: package is intended for Ubuntu, Debian, and compatible Debian-based distributions.
                - paragraph [ref=f2e277]: "Install it by opening the downloaded package in your software installer, or run:"
                - generic [ref=f2e278]: sudo apt install ./chunk-surfer*.deb
                - paragraph [ref=f2e279]: After installation, launch Chunk Surfer from your application menu.
                - paragraph [ref=f2e280]: Players using another Linux distribution should generally choose the AppImage instead.
                - heading "AUDIO" [level=2] [ref=f2e281]
                - paragraph [ref=f2e282]: Headphones are strongly recommended.
                - paragraph [ref=f2e283]: No specific Bluetooth, audio-interface, or sample-rate compatibility problems are currently known. During the beta, please report any device-specific audio issues.
                - paragraph [ref=f2e284]: "When reporting an audio problem, include:"
                - list [ref=f2e285]:
                  - listitem [ref=f2e286]: Operating system and version
                  - listitem [ref=f2e287]: Headphone, speaker, or audio-interface model
                  - listitem [ref=f2e288]: Connection type, such as wired, Bluetooth, USB, or HDMI
                  - listitem [ref=f2e289]: Sample rate, when known
                  - listitem [ref=f2e290]: Whether the problem occurs immediately or after playing for a while
                - heading "CONTROLLERS" [level=2] [ref=f2e291]
                - paragraph [ref=f2e292]: Chunk Surfer supports full controller input as well as keyboard and mouse.
                - paragraph [ref=f2e293]: Controller support can vary by operating system, driver, connection type, and controller model. Please include those details when reporting an input problem.
                - heading "PERMISSIONS" [level=2] [ref=f2e294]
                - paragraph [ref=f2e295]: Chunk Surfer may request optional operating-system permissions.
                - paragraph [ref=f2e296]: These permissions are not required for normal gameplay. You may deny them and continue playing.
                - paragraph [ref=f2e297]: Permissions can be reviewed or changed later through your operating system’s privacy or application settings.
                - heading "SAVING PROGRESS" [level=2] [ref=f2e298]
                - paragraph [ref=f2e299]: Chunk Surfer saves progress automatically to local application data.
                - list [ref=f2e300]:
                  - listitem [ref=f2e301]: There is no manual save button.
                  - listitem [ref=f2e302]: Progress is stored on the current computer.
                  - listitem [ref=f2e303]: Cloud saves are not currently available.
                  - listitem [ref=f2e304]: Saves do not automatically transfer between computers or operating systems.
                  - listitem [ref=f2e305]: Avoid deleting local application data unless you intend to reset your progress.
                - paragraph [ref=f2e306]: Because this is a beta, save compatibility between major builds is not guaranteed. Any update that intentionally resets or changes save data will be identified in the release notes.
                - heading "UPDATING the GAME" [level=2] [ref=f2e307]
                - paragraph [ref=f2e308]: Players using the itch.io desktop app may receive updates through the app when a compatible build is available.
                - paragraph [ref=f2e309]: Players who download directly from the website should return to this page to download new beta releases.
                - paragraph [ref=f2e310]: Unless a release note says otherwise, installing an update over the existing version should preserve local progress. During the beta, keeping a copy of important save data is recommended before installing major updates.
                - heading "TROUBLESHOOTING" [level=2] [ref=f2e311]
                - paragraph [ref=f2e312]: "Before reporting a problem:"
                - list [ref=f2e313]:
                  - listitem [ref=f2e314]: Confirm that you downloaded the correct build for your operating system.
                  - listitem [ref=f2e315]: Restart the game.
                  - listitem [ref=f2e316]: Restart your computer.
                  - listitem [ref=f2e317]: Confirm that your graphics drivers and operating system are current.
                  - listitem [ref=f2e318]: Disconnect unnecessary controllers or audio devices and try again.
                  - listitem [ref=f2e319]: Re-download the build if the installer or archive may be incomplete.
                - paragraph [ref=f2e320]: "When reporting a bug, please include:"
                - list [ref=f2e321]:
                  - listitem [ref=f2e322]: Operating system and version
                  - listitem [ref=f2e323]: Computer model or hardware specifications
                  - listitem [ref=f2e324]:
                    - text: "Download used: Windows, macOS, AppImage, or"
                    - code [ref=f2e325]: .deb
                  - listitem [ref=f2e326]: Game version
                  - listitem [ref=f2e327]: Keyboard/mouse or controller
                  - listitem [ref=f2e328]: What you expected to happen
                  - listitem [ref=f2e329]: What happened instead
                  - listitem [ref=f2e330]: Steps that reproduce the problem
                  - listitem [ref=f2e331]: Screenshot, video, or error message when available
                - paragraph [ref=f2e332]: Thank you for helping test Chunk Surfer.
