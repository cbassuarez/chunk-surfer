              - paragraph [ref=f2e53]: ELLERY HOLDINGS ORDER 4417-C
              - paragraph [ref=f2e54]:
                - strong [ref=f2e55]: Five rooms. Five clean takes and you’re done… or so you think.
              - paragraph [ref=f2e56]: Record the sound of empty rooms in a condemned conservatory. Stay still. Stay silent. Finish before demolition begins.
              - blockquote [ref=f2e57]:
                - text: WORK ORDER ·SOURCE 4417-C
                - paragraph [ref=f2e58]:
                  - strong [ref=f2e59]: site
                  - generic [ref=f2e60]: Ellery Conservatory of Music. Condemned.
                - paragraph [ref=f2e61]:
                  - strong [ref=f2e62]: deliver
                  - generic [ref=f2e63]: Five clean room-tone recordings.
                - paragraph [ref=f2e64]:
                  - strong [ref=f2e65]: window
                  - generic [ref=f2e66]: One night. Demolition begins at 06:00.
                - paragraph [ref=f2e67]:
                  - strong [ref=f2e68]: rules
                  - generic [ref=f2e69]: If you can hear yourself on the take, the take is not the room.
              - paragraph [ref=f2e70]: "● ACCOUNT OPEN: CONTRACTOR PRESENT"
              - separator [ref=f2e71]
              - paragraph [ref=f2e72]: 01 / CASE — first person audio-reactive horror
              - heading "The job is to record nothing." [level=2] [ref=f2e73]
              - paragraph [ref=f2e74]:
                - emphasis [ref=f2e75]: Chunk Surfer
                - text: is a short first-person psychological horror game about sound recording. As a field recordist in the condemned Ellery Conservatory, your job is to capture five clean room sounds as you evade invisible entities, confront your murky past, and figure out what happened to the previous recordist who tried to do this gig first.
              - paragraph [ref=f2e76]: Monitor each space, roll the recorder, then stay still and silent – or, rather, vulnerable – for a whole minute. Movement or noise can invalidate the take. An optional computer microphone adds noise from your real room through local loudness analysis only; audio is never recorded or uploaded.
              - paragraph [ref=f2e77]: 02 / MATERIAL — offline shader diffusion over traditional PBR maps
              - heading "Stable Diffusion in game shader stack." [level=2] [ref=f2e78]
              - paragraph [ref=f2e79]:
                - emphasis [ref=f2e80]: Chunk Surfer
                - text: "is perhaps the first 3D psychological horror game with a local Stable Diffusion material renderer that keeps generating during play: GPU-budgeted local Stable Diffusion designed as neural rendering shaders for video games."
              - paragraph [ref=f2e81]:
                - strong [ref=f2e82]: "Technical jargon:"
                - text: it does not redraw the camera image or replace the game’s regular 3D texture maps. Instead, it layers machine learning hallucinations over authored PBR materials; every 5–15 seconds, when the frame budget permits, one visible surface is re-hallucinated and crossfaded into the building over 6–12 seconds. This is real-time AI texture crossfading rather than full-screen frame generation. On top of traditional PBR maps sits this hallucination engine, which itself sits under an 8-bit mesh.
              - paragraph [ref=f2e83]: The result is a unique low-resolution look that is neither 8bit nor diffused nor traditional PBR texturing, but a mix of the three.
              - paragraph [ref=f2e84]: Geometry, lighting, depth, movement, and UI remain native, while reaction-diffusion, VFD pixel-mesh, datamosh, and glass shaders complete the stack. The entire visual lens runs locally and offline on the player’s GPU. No image is uploaded to a cloud service.
              - paragraph [ref=f2e85]: 03 / FIELD — listen. record. do not move.
              - heading "Your movement betrays you." [level=2] [ref=f2e86]
              - paragraph [ref=f2e87]: Monitor each assigned space before committing to a take. Once the recorder rolls, light and movement become liabilities. A clean recording advances the work order. A contaminated one must be attempted again, and a loud mistake can give whatever else is in the building someone to follow.
              - paragraph [ref=f2e88]: Your torch makes the conservatory visible but its battery is finite and its beam attracts attention. Footsteps, handling, and injuries make noise. Corridors outside your sight and hearing can change, so a remembered route may not remain the route you return to.
              - paragraph [ref=f2e89]: 04 / RECORD — redaction turn-based combat
              - heading "Pick up the pieces." [level=2] [ref=f2e90]
              - paragraph [ref=f2e91]: "Inspect the packet left by the previous contractor and play back what your recorder captured. Later encounters turn transcript redaction into a physical struggle: choose what to black out, protect what remains readable, and live with the record you produce."
              - blockquote [ref=f2e92]:
                - paragraph [ref=f2e93]: a game of redaction. black out the words that change your reality to favorable odds.
              - paragraph [ref=f2e94]: 05 / SOURCE — source space
              - heading "The game’s own files become the map." [level=2] [ref=f2e95]
              - paragraph [ref=f2e96]: The investigation eventually ruptures into literal source-code space, where the game’s own files become terrain, passages, and surfaces that can be altered. The machinery behind the fiction is not a bonus menu. It is somewhere you go.
              - paragraph [ref=f2e97]: 06 / INPUT — let your room into the game—or do not
              - heading "Your microphone is optional. Its consequences are not cosmetic." [level=2] [ref=f2e98]
              - paragraph [ref=f2e99]:
                - text: When enabled,
                - emphasis [ref=f2e100]: Chunk Surfer
                - text: measures loudness locally while a take is rolling. Noise in your real room can contaminate a take or provoke an in-game response. It never records, stores, transmits, uploads, or plays back microphone audio.
              - paragraph [ref=f2e101]: You can deny or revoke permission and complete the game without microphone input.
              - paragraph [ref=f2e102]: 07 / RELEASE — public beta
              - heading "Now out for public beta testing." [level=2] [ref=f2e103]
              - paragraph [ref=f2e104]: This game is in its nascent stages. Expect some bugs. Dialog is very likely to change, story is not. Expected bugs list and feedback links incoming soon.
