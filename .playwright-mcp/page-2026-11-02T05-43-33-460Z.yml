              - heading "AUDIO" [level=2] [ref=f1e272]
              - paragraph [ref=f1e273]: Headphones are strongly recommended.
              - paragraph [ref=f1e274]: No specific Bluetooth, audio-interface, or sample-rate compatibility problems are currently known. During the beta, please report any device-specific audio issues.
              - paragraph [ref=f1e275]: "When reporting an audio problem, include:"
              - list [ref=f1e276]:
                - listitem [ref=f1e277]: Operating system and version
                - listitem [ref=f1e278]: Headphone, speaker, or audio-interface model
                - listitem [ref=f1e279]: Connection type, such as wired, Bluetooth, USB, or HDMI
                - listitem [ref=f1e280]: Sample rate, when known
                - listitem [ref=f1e281]: Whether the problem occurs immediately or after playing for a while
              - heading "CONTROLLERS" [level=2] [ref=f1e282]
              - paragraph [ref=f1e283]: Chunk Surfer supports full controller input as well as keyboard and mouse.
              - paragraph [ref=f1e284]: Controller support can vary by operating system, driver, connection type, and controller model. Please include those details when reporting an input problem.
              - heading "PERMISSIONS" [level=2] [ref=f1e285]
              - paragraph [ref=f1e286]: Chunk Surfer may request optional operating-system permissions.
              - paragraph [ref=f1e287]: These permissions are not required for normal gameplay. You may deny them and continue playing.
              - paragraph [ref=f1e288]: Permissions can be reviewed or changed later through your operating system’s privacy or application settings.
              - heading "SAVING PROGRESS" [level=2] [ref=f1e289]
              - paragraph [ref=f1e290]: Chunk Surfer saves progress automatically to local application data.
              - list [ref=f1e291]:
                - listitem [ref=f1e292]: There is no manual save button.
                - listitem [ref=f1e293]: Progress is stored on the current computer.
                - listitem [ref=f1e294]: Cloud saves are not currently available.
                - listitem [ref=f1e295]: Saves do not automatically transfer between computers or operating systems.
                - listitem [ref=f1e296]: Avoid deleting local application data unless you intend to reset your progress.
              - paragraph [ref=f1e297]: Because this is a beta, save compatibility between major builds is not guaranteed. Any update that intentionally resets or changes save data will be identified in the release notes.
              - heading "UPDATING the GAME" [level=2] [ref=f1e298]
              - paragraph [ref=f1e299]: Players using the itch.io desktop app may receive updates through the app when a compatible build is available.
              - paragraph [ref=f1e300]: Players who download directly from the website should return to this page to download new beta releases.
              - paragraph [ref=f1e301]: Unless a release note says otherwise, installing an update over the existing version should preserve local progress. During the beta, keeping a copy of important save data is recommended before installing major updates.
              - heading "TROUBLESHOOTING" [level=2] [ref=f1e302]
              - paragraph [ref=f1e303]: "Before reporting a problem:"
              - list [ref=f1e304]:
                - listitem [ref=f1e305]: Confirm that you downloaded the correct build for your operating system.
                - listitem [ref=f1e306]: Restart the game.
                - listitem [ref=f1e307]: Restart your computer.
                - listitem [ref=f1e308]: Confirm that your graphics drivers and operating system are current.
                - listitem [ref=f1e309]: Disconnect unnecessary controllers or audio devices and try again.
                - listitem [ref=f1e310]: Re-download the build if the installer or archive may be incomplete.
              - paragraph [ref=f1e311]: "When reporting a bug, please include:"
              - list [ref=f1e312]:
