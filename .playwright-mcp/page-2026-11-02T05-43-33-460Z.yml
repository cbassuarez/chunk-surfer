      - text: AUDIOCORP ·LOCAL MONITOR ·SOURCE 4417-C
      - generic [ref=f1e46]:
        - img "CHUNK SURFER" [ref=f1e47]
        - heading "CHUNK SURFER" [level=1] [ref=f1e48]
      - generic [ref=f1e50]:
        - generic [ref=f1e51]:
          - generic [ref=f1e52]:
            - paragraph [ref=f1e53]: ELLERY HOLDINGS ORDER 4417-C
            - paragraph [ref=f1e54]:
              - strong [ref=f1e55]: Five rooms. Five clean takes and you’re done… or so you think.
            - paragraph [ref=f1e56]: Record the sound of empty rooms in a condemned conservatory. Stay still. Stay silent. Finish before demolition begins.
            - blockquote [ref=f1e57]:
              - text: WORK ORDER ·SOURCE 4417-C
              - strong [ref=f1e58]: site
              - text: Ellery Conservatory of Music. Condemned.
              - strong [ref=f1e59]: deliver
              - text: Five clean room-tone recordings.
              - strong [ref=f1e60]: window
              - text: One night. Demolition begins at 06:00.
              - strong [ref=f1e61]: rules
              - text: If you can hear yourself on the take, the take is not the room.
            - paragraph [ref=f1e62]: "● ACCOUNT OPEN: CONTRACTOR PRESENT"
            - separator [ref=f1e63]
            - paragraph [ref=f1e64]: 01 / CASE — first person audio-reactive horror
            - heading "The job is to record nothing." [level=2] [ref=f1e65]
            - paragraph [ref=f1e66]:
              - emphasis [ref=f1e67]: Chunk Surfer
              - text: is a short first-person psychological horror game about sound recording. As a field recordist in the condemned Ellery Conservatory, your job is to capture five clean room sounds as you evade invisible entities, confront your murky past, and figure out what happened to the previous recordist who tried to do this gig first.
            - paragraph [ref=f1e68]: Monitor each space, roll the recorder, then stay still and silent – or, rather, vulnerable – for a whole minute. Movement or noise can invalidate the take. An optional computer microphone adds noise from your real room through local loudness analysis only; audio is never recorded or uploaded.
            - paragraph [ref=f1e69]: 02 / MATERIAL — offline shader diffusion over traditional PBR maps
            - heading "Stable Diffusion in game shader stack." [level=2] [ref=f1e70]
            - paragraph [ref=f1e71]:
              - emphasis [ref=f1e72]: Chunk Surfer
              - text: "is perhaps the first 3D psychological horror game with a local Stable Diffusion material renderer that keeps generating during play: GPU-budgeted local Stable Diffusion designed as neural rendering shaders for video games."
            - paragraph [ref=f1e73]:
              - strong [ref=f1e74]: "Technical jargon:"
              - text: it does not redraw the camera image or replace the game’s regular 3D texture maps. Instead, it layers machine learning hallucinations over authored PBR materials; every 5–15 seconds, when the frame budget permits, one visible surface is re-hallucinated and crossfaded into the building over 6–12 seconds. This is real-time AI texture crossfading rather than full-screen frame generation. On top of traditional PBR maps sits this hallucination engine, which itself sits under an 8-bit mesh.
            - paragraph [ref=f1e75]: The result is a unique low-resolution look that is neither 8bit nor diffused nor traditional PBR texturing, but a mix of the three.
            - paragraph [ref=f1e76]: Geometry, lighting, depth, movement, and UI remain native, while reaction-diffusion, VFD pixel-mesh, datamosh, and glass shaders complete the stack. The entire visual lens runs locally and offline on the player’s GPU. No image is uploaded to a cloud service.
            - paragraph [ref=f1e77]: 03 / FIELD — listen. record. do not move.
            - heading "Your movement betrays you." [level=2] [ref=f1e78]
            - paragraph [ref=f1e79]: Monitor each assigned space before committing to a take. Once the recorder rolls, light and movement become liabilities. A clean recording advances the work order. A contaminated one must be attempted again, and a loud mistake can give whatever else is in the building someone to follow.
            - paragraph [ref=f1e80]: Your torch makes the conservatory visible but its battery is finite and its beam attracts attention. Footsteps, handling, and injuries make noise. Corridors outside your sight and hearing can change, so a remembered route may not remain the route you return to.
            - paragraph [ref=f1e81]: 04 / RECORD — redaction turn-based combat
            - heading "Pick up the pieces." [level=2] [ref=f1e82]
            - paragraph [ref=f1e83]: "Inspect the packet left by the previous contractor and play back what your recorder captured. Later encounters turn transcript redaction into a physical struggle: choose what to black out, protect what remains readable, and live with the record you produce."
            - blockquote [ref=f1e84]: a game of redaction. black out the words that change your reality to favorable odds.
            - paragraph [ref=f1e85]: 05 / SOURCE — source space
            - heading "The game’s own files become the map." [level=2] [ref=f1e86]
            - paragraph [ref=f1e87]: The investigation eventually ruptures into literal source-code space, where the game’s own files become terrain, passages, and surfaces that can be altered. The machinery behind the fiction is not a bonus menu. It is somewhere you go.
            - paragraph [ref=f1e88]: 06 / INPUT — let your room into the game—or do not
            - heading "Your microphone is optional. Its consequences are not cosmetic." [level=2] [ref=f1e89]
            - paragraph [ref=f1e90]:
              - text: When enabled,
              - emphasis [ref=f1e91]: Chunk Surfer
              - text: measures loudness locally while a take is rolling. Noise in your real room can contaminate a take or provoke an in-game response. It never records, stores, transmits, uploads, or plays back microphone audio.
            - paragraph [ref=f1e92]: You can deny or revoke permission and complete the game without microphone input.
            - paragraph [ref=f1e93]: 07 / RELEASE — public beta
            - heading "Now out for public beta testing." [level=2] [ref=f1e94]
            - paragraph [ref=f1e95]: This game is in its nascent stages. Expect some bugs. Dialog is very likely to change, story is not. Expected bugs list and feedback links incoming soon.
