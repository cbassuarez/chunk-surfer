    - heading "Three victories, three contact cycles" [level=2] [ref=f1e90]
    - paragraph [ref=f1e91]: "The requirement is three separately initiated fights: win, return to contact/dialogue, then choose to engage again. Surviving three combat rounds does not count as three victories. The final reward waits for the third win."
