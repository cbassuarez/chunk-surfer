                    - text: The
                    - strong [ref=f2e226]: Microsoft Edge WebView2 Runtime
                    - text: must be installed. If it is missing, install it from Microsoft and launch the game again.
                  - listitem [ref=f2e227]:
                    - text: If SmartScreen shows
                    - emphasis [ref=f2e228]: Windows protected your PC
                    - text: ", use"
                    - strong [ref=f2e229]: More info → Run anyway
                    - text: for this downloaded beta.
                - heading "Linux" [level=2] [ref=f2e230]
                - list [ref=f2e231]:
                  - listitem [ref=f2e232]:
                    - strong [ref=f2e233]: "AppImage:"
                    - text: "make the file executable and run it:"
                    - code [ref=f2e234]: chmod +x chunk-surfer-linux-x64.AppImage
                    - code [ref=f2e235]: ./chunk-surfer-linux-x64.AppImage
                  - listitem [ref=f2e236]:
                    - strong [ref=f2e237]: "Debian / Ubuntu:"
                    - text: install with
                    - code [ref=f2e238]: sudo apt install ./chunk-surfer-linux-x64.deb
                    - text: ", then open"
                    - strong [ref=f2e239]: Chunk Surfer
                    - text: from your applications menu.
                - paragraph [ref=f2e240]: The game needs working 3D graphics support. If you see a blank or incorrectly rendered world, include your GPU and graphics-driver details in a bug report. Compatibility and performance on additional hardware are still being tested.
                - heading "Controls" [level=2] [ref=f2e241]
                - paragraph [ref=f2e242]: "Keyboard and mouse or a controller can be used for normal play. Controller buttons can be remapped in Settings. These are the default on-foot keyboard controls; driving and other scenes show their own prompts:"
                - table [ref=f2e243]:
                  - rowgroup [ref=f2e244]:
                    - row [ref=f2e245]:
                      - columnheader "Key" [ref=f2e246]
                      - columnheader "Action" [ref=f2e247]
                  - rowgroup [ref=f2e248]:
                    - row [ref=f2e249]:
                      - cell "WASD / arrow keys" [ref=f2e250]
                      - cell "Move" [ref=f2e251]
                    - row [ref=f2e252]:
                      - cell "Shift" [ref=f2e253]
                      - cell "Quiet movement" [ref=f2e254]
                    - row [ref=f2e255]:
                      - cell "C" [ref=f2e256]
                      - cell "Hide" [ref=f2e257]
                    - row [ref=f2e258]:
                      - cell "F" [ref=f2e259]
                      - cell "Light" [ref=f2e260]
                    - row [ref=f2e261]:
                      - cell "B" [ref=f2e262]
                      - cell "Bag" [ref=f2e263]
                    - row [ref=f2e264]:
                      - cell "M" [ref=f2e265]
                      - cell "Map" [ref=f2e266]
                    - row [ref=f2e267]:
                      - cell "R" [ref=f2e268]
                      - cell "Open recorder" [ref=f2e269]
                    - row [ref=f2e270]:
                      - cell "V" [ref=f2e271]
                      - cell "Radio" [ref=f2e272]
                    - row [ref=f2e273]:
                      - cell "E" [ref=f2e274]
                      - cell "Interact" [ref=f2e275]
                    - row [ref=f2e276]:
                      - cell "P" [ref=f2e277]
                      - cell "Playback" [ref=f2e278]
                    - row [ref=f2e279]:
                      - cell "Esc" [ref=f2e280]
                      - cell "Menu / pause" [ref=f2e281]
                - paragraph [ref=f2e282]:
                  - text: The recorder has
                  - strong [ref=f2e283]: REC
                  - text: ","
                  - strong [ref=f2e284]: STOP
                  - text: ", and"
                  - strong [ref=f2e285]: TAKES
                  - text: controls. Opening it does not pause the room. Follow the prompts on the machine when starting a recording or saving a usable take.
                - heading "Microphone and local recordings" [level=2] [ref=f2e286]
                - paragraph [ref=f2e287]: Microphone permission is optional. With permission, the game measures room loudness locally so real noise can affect play. You can also choose to record spoken take slates and voicemail. These recordings stay on your device; the game does not recognize speech or automatically upload audio. You can complete the game without a microphone.
                - paragraph [ref=f2e288]:
                  - text: Use
                  - strong [ref=f2e289]: Settings → Input
                  - text: to select an input and test its level. Operating-system privacy settings control the app’s microphone permission.
                - heading "Local profile and desktop effects" [level=2] [ref=f2e290]
                - paragraph [ref=f2e291]: The separate profile choice permits disclosed local personalization using names, computer details, and in-game responses. Optional desktop effects can move the game window, open additional game-owned windows, and create field-return files in the game’s local data folder. Profile data is processed locally and is not uploaded.
                - paragraph [ref=f2e292]: You can play the complete game with the profile off. Settings let you disable individual modules, restore the game window, and erase the profile data.
                - heading "Content warning and accessibility" [level=2] [ref=f2e293]
                - paragraph [ref=f2e294]: CAUTION Sustained dread, sudden loud sounds, deliberate jumpscares, flashing lights, and high-contrast patterns. Set your preferred effects before starting.
                - paragraph [ref=f2e295]: Settings include text speed and instant text, flash/strobe and screen-shake reduction, controller configuration, recording forgiveness, navigation help, combat assistance, and escape-timer adjustments.
                - heading "Saved data and uninstalling" [level=2] [ref=f2e296]
                - paragraph [ref=f2e297]:
                  - text: Removing the app normally leaves local progress, settings, and recordings on this device. To remove them too, first open
                  - strong [ref=f2e298]: Settings → Memory → Erase all data & restart
                  - text: in the game and confirm. Wait for the restart, then quit and remove the app or package. Exported copies and operating-system backups are not removed by this reset.
                - heading "Report a problem" [level=2] [ref=f2e299]
                - paragraph [ref=f2e300]: Include the game version, operating system, CPU/GPU, controller model if relevant, and the steps that led to the problem. A diagnostic report from the in-game About/Support panel also helps.
                - list [ref=f2e301]:
                  - listitem [ref=f2e302]:
                    - strong [ref=f2e303]: bugs
                    - link "Report a bug" [ref=f2e305] [cursor=pointer]:
                      - /url: https://github.com/cbassuarez/chunk-surfer/issues/new?labels=bug
                  - listitem [ref=f2e306]:
                    - strong [ref=f2e307]: feedback
                    - link "Send playtest feedback" [ref=f2e309] [cursor=pointer]:
                      - /url: https://github.com/cbassuarez/chunk-surfer/issues/new?labels=feedback
                - paragraph [ref=f2e310]:
                  - strong [ref=f2e311]: CHUNK SURFER / v0.3.0 PUBLIC BETA
