  - heading "What remains uncertain" [level=2] [ref=f6e130]
  - paragraph [ref=f6e131]: "No claim of auditory or player validation: this environment produced and measured the sound but did not establish through human listening that it feels like a Mass, that the spatial image is convincing, or that the service feels unnaturally prolonged. The supplied capture is the review material."
  - paragraph [ref=f6e132]: The browser proof uses an authoring run, station warps and explicitly labelled protected-state fixtures. It establishes runtime behaviour, not an uninterrupted campaign, a complete battle victory, or packaged native acceptance. The unavailable local diffusion service produced existing connection errors; no chapel bank or audio runtime failure was reported.
  - paragraph [ref=f6e133]: "Next listening pass: assess the actual capture before changing levels. With unfamiliar players, allow an ordinary chapel visit without describing the sound. Begin with “What happened?” Preserve spontaneous accounts before asking whether they heard a service, located its participants, felt watched, or thought it was repeating. Include players who fail to identify it. Until then, recognition, unease and fatigue remain hypotheses."
  - generic [ref=f6e134]: No locations, lore, mechanics, dialogue, scare triggers, progression or apparition poses added. The sound belongs to the existing service. Technical receipts accompany the work; listening and player acceptance remain open.