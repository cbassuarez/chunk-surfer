  - heading "Recordings and editable sources" [level=2] [ref=f6e80]
  - paragraph [ref=f6e81]: This is an assembled fictional service, not an archival Mass or a reconstruction of a complete historical rite. The priest material is a contemporary human reading of traditional Latin texts. The response is one field-recorded priest/congregation. The church occupancy is contemporary; its source title dates the building. Cloth and bench are adapted foley.
