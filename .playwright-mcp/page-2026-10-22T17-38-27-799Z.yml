  - paragraph [ref=f6e118]: All sources are CC0 or CC BY; required credits and adaptation notices are included in the game. Gentle filtering, levelling and edge fades produce a 10-clip, 1.03 MB bank. Licensed HQ previews are retained with source-page snapshots and hashes; lossless originals were not available through this workflow.
  - paragraph [ref=f6e119]: A restrained 3.8-second procedural convolution tail and 28 ms predelay connect the altar reading to the room. This is a synthetic response, not a measured chapel impulse. The recorded group receives less added room than the dry reading. No new bitcrushing was applied to these voices; the Ear Room's existing crushed gurgles remain intact.
