  - heading "A ritual that has ceased to finish" [level=2] [ref=f6e21]
  - paragraph [ref=f6e22]: The officiant speaks complete Latin prayer clauses in their recorded order. A single real congregation recording answers “Amen.” Quiet church occupancy, cloth movement and an old wooden bench carry the gaps. Long pauses belong to the service rather than announcing a scare.
  - paragraph [ref=f6e23]: The 118-second cycle follows the running audio context, including time spent elsewhere during play. Returning seeks into the current phrase. It does not replay missed creaks, repeat an entrance cue or react to your gaze. The intended discomfort is a ritual continuing without acknowledgement, with the fixed figures already participating. Continuity across application restarts or save/reload is not claimed.
  - paragraph [ref=f6e24]: The officiant is anchored to the existing celebrant's mouth. Three existing pew stations carry the response, room and material sounds. Distance, head direction, rear filtering and the existing door-occlusion system govern audibility. One recorded group responds at a time; it has not been multiplied into a synthetic choir.
