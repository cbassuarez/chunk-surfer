            - paragraph [ref=f82e84]: BEFORE YOU PLAY
            - generic [ref=f82e85]:
              - heading "SET THE INPUT." [level=2] [ref=f82e86]
              - paragraph [ref=f82e88]: MICROPHONE OPTIONAL · LOCAL PROFILE OPTIONAL
              - paragraph [ref=f82e89]: Microphone permission is optional. With permission, room loudness is measured locally. You can choose to record spoken slates and voicemail; those recordings stay on your device. There is no speech recognition or automatic audio upload.
              - paragraph [ref=f82e90]:
                - text: A separate optional local profile permits disclosed personalization using names, computer details, and in-game responses. Optional effects can move the game window, open game-owned windows, and create files in the game's local data folder. The complete game remains available without microphone input or profiling. Disable modules, restore the window, or erase profile data in
                - strong [ref=f82e91]: SETTINGS
                - text: .
              - paragraph [ref=f82e92]: Use keyboard and mouse or a controller. Adjust text speed, flashes, screen shake, controller bindings, recording forgiveness, navigation help, combat assistance, and escape timers in Settings.
              - heading "CONTENT WARNING" [level=2] [ref=f82e93]
              - paragraph [ref=f82e94]: Sustained dread, sudden loud sounds, deliberate jumpscares, flashing lights, and high-contrast patterns. Reduce visual effects in Settings. Optional desktop effects may move the game window and open additional windows.
