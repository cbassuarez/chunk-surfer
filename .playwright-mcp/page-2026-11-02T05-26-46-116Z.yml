            - paragraph [ref=f82e60]: STEP OUT. CHECK IN.
          - generic [ref=f82e61]:
            - paragraph [ref=f82e62]: 04 / ONWARD AND RETURN
            - generic [ref=f82e63]:
              - heading "KEEP GOING. KEEP LISTENING." [level=2] [ref=f82e64]
              - paragraph [ref=f82e66]: Climb through instruments large enough to become buildings. Cross rooms joined at impossible angles. Find the next landing. Take the wheel and drive into the storm.
              - paragraph [ref=f82e67]: Sit with a performance. Let the conversation run. Hear the hands, the mistakes, and the space after a note. Decide how long to remain. Get up while you still can.
              - paragraph [ref=f82e68]:
                - text: Choose what to carry out. Reach an ending and check
                - strong [ref=f82e69]: ARCHIVE / 100%
                - text: for discoveries and filed returns. Finish a run; if it qualifies, play through that same night from another side.
