            - generic [ref=f82e43]:
              - heading "READ THE MOVE. ANSWER." [level=2] [ref=f82e44]
              - paragraph [ref=f82e46]:
                - text: Patch your techniques before the encounter.
                - strong [ref=f82e47]: EXPOSE
                - text: what hides.
                - strong [ref=f82e48]: MONITOR
                - text: a broadcast, capture it, then use
                - strong [ref=f82e49]: PLAYBACK
                - text: .
                - strong [ref=f82e50]: HOLD
                - text: against a blow or time a parry to turn it back. Earn another action with a good read. Watch the battery and your composure.
          - generic [ref=f82e51]:
            - paragraph [ref=f82e52]: 03 / PEOPLE AND RECORDS
            - generic [ref=f82e53]:
              - heading "TALK. READ. CALL." [level=2] [ref=f82e54]
              - paragraph [ref=f82e56]: Go across the road. Speak to the people keeping the pub warm. Help with an errand. Meet the people still occupying the school. Ask about a performance. Read the retained records. Follow the letters and phone calls. Hear what has been left out of the account, including your own.
          - generic [ref=f82e57]:
