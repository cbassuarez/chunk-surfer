          - generic [ref=f82e27]:
            - paragraph [ref=f82e28]: 01 / FIELD CAPTURE
            - generic [ref=f82e29]:
              - heading "ARRIVE. LISTEN. RECORD." [level=2] [ref=f82e30]
              - paragraph [ref=f82e32]:
                - text: Step out of the van. Check in. Choose your equipment and bring a light. Open the room in your headphones, check the level, then press
                - strong [ref=f82e33]: REC
                - text: and hold still. Keep your footsteps, handling, and breath off the take. Press
                - strong [ref=f82e34]: STOP
                - text: when it is usable. Open
                - strong [ref=f82e35]: TAKES
                - text: to hear what came back.
              - paragraph [ref=f82e36]: Mind the torch battery. Keep the beam and your noise off anything you would rather leave alone.
          - generic [ref=f82e37]:
            - link [ref=f82e38] [cursor=pointer]:
              - /url: ./media/storefront/recorder.jpg
              - img "The field recorder shows its tape counter, level display, and REC, STOP, and TAKES controls beside a navigator map and room-level LCD." [ref=f82e39]
            - paragraph [ref=f82e40]: OPEN THE RECORDER. CHECK THE ROOM.
          - generic [ref=f82e41]:
