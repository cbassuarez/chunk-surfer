    - paragraph [ref=f36e249]: What failed / what remains unproven
    - heading "Recognition and weight still need witnesses." [level=2] [ref=f36e250]
    - paragraph [ref=f36e251]: "The original copy could not be approached because it followed the player. A facing sheet also had a second mass behind it: removing only the front skin would have made a false spirit opening. The treatment addresses both structural problems, and their saved technical checks remain inspectable."
    - paragraph [ref=f36e252]: Initial inspection and the first captured iteration exposed presentation failures, including a road gap during convergence. The final treatment includes the evenly distributed near curtain, the 0.12 s occupancy beat, stronger fixed architectural light, and local paper/warning cleanup. Earlier failed captures remain archived rather than being represented as final evidence.
    - paragraph [ref=f36e253]: The source recordings are limited. Oulu documents selective panel demolition, the wood source is a preview, and the stone source was cleaned by its recorder. Microphone perspective, original travel delay and absolute scale are unmeasured. Source audition has not occurred in this tool context; provisional composition from synchronized frames and energy analysis does not satisfy listening acceptance.
    - paragraph [ref=f36e254]: The normal actual route, matched baseline and media are technically verified; an independent frame review supports the corrected normal presentation. Remaining settings/protection runs are separate. Perceived recognition, human release, mass, acoustic placement, threat and orientation still require listening and unfamiliar players. Native-app, actual operating-system window behavior and full-campaign acceptance remain pending. Wider rollout is not established by this single encounter.
  - generic [ref=f36e255]: Implementation report / 22 October 2026. Current source and saved receipts are linked separately. Static document; no animation, autoplay, microphone or automatic game execution.