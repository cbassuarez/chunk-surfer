      - strong [ref=e142]: "Hall engineering capture: recorded."
      - text: The cue fired once, 246.46 seconds after trial start, after the original four-minute quiet. This fixture used probe-directed aiming, a pinned existing lamp, stable test focus and a forced existing absence card. All five sources stayed at the changed figure’s fixed world station; no new actor or light was added. The saved video includes program output and synchronized light/card/clock logs. This proves the engineering path under these conditions; it is not a natural first exposure or participant result. The optional local diffusion service was offline, so the game retained its procedural fallback.
