    - heading "Technical evidence and the actual encounter" [level=2] [ref=e133]
    - paragraph [ref=e134]: The cue observes the existing Hall formation. Held poses, world anchoring, current lights, movement, dither and game punishment remain under their existing systems. The four-minute opening quiet, shared 150-second cooldown, room cap and recording protections remain. Pause, focus loss, recorder activity and other protected states cancel scheduled contacts and wet tails.
