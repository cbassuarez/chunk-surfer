    - generic [ref=e150]:
      - generic [ref=e151]:
        - heading "Fresh first encounters" [level=3] [ref=e152]
        - paragraph [ref=e153]: Use randomized, balanced between-player assignments to silence, ordinary applause and treatment. Normal movement; matched prepared game state. Begin with “What happened?”, then “Where did anything seem to happen?” Lock spontaneous answers before asking about recognition, presence, startle or spatial fit. Preserve exact responses and code them blind to condition. Retain no-cue trials as acquisition failures.
      - generic [ref=e154]:
        - heading "Current judgment" [level=3] [ref=e155]
        - paragraph [ref=e156]: The original dry scientific claps were heard as clicks and too synthetic; the first composed cue was heard as popcorn. That treatment failed recognition and is retained as negative evidence. The longer source samples were recognized. The V2 composite, perceived level match and four perceptual claims remain untested; there are zero fresh participants.
