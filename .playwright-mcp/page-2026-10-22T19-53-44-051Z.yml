  - generic [ref=f29e59]:
    - paragraph [ref=f29e60]: The built treatment
    - heading "The frame explains the weight." [level=2] [ref=f29e61]
    - generic [ref=f29e62]:
      - generic [ref=f29e63]:
        - heading "Above" [level=3] [ref=f29e64]
        - paragraph [ref=f29e65]: Eight hollow castings have soundbows, visible wall thickness, canons and headstocks. Grooved wooden wheels, individual clappers, stays and sliders retain their existing articulated motion. Scale-aware bearing housings meet the gudgeons; the supporting timber now sits below those axes.
        - paragraph [ref=f29e66]: Iron straps, fixings, joint faces and handled surfaces articulate the apparatus. The deck, guard, hatch and perimeter still describe the same physical route. Four legacy beams that crossed the bearing axes were replaced; the rest of the original architectural geometry and normals remain.
      - generic [ref=f29e67]:
        - heading "Below" [level=3] [ref=f29e68]
        - paragraph [ref=f29e69]: Larger paving establishes the floor. Carved pews and choir stalls, a hollow font, a heavy altar, an abraded monument, a recumbent stone tomb and a pierced pulpitum give the church specific mass and construction. Removed-object traces and surviving ornament carry its stripped history.
        - paragraph [ref=f29e70]: Deep inward stone splays frame cold, closed glazing. These faces remain against the existing solid walls; they create no new openings or through-views. Quieter broad materials let the final dither retain architectural depth while bronze edges and carved forms carry detail.
