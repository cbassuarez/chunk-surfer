    - paragraph [ref=f29e33]: The tower is occupied
    - heading "Waiting, bracing, sitting, looking up." [level=2] [ref=f29e34]
    - generic [ref=f29e35]:
      - generic [ref=f29e36]:
        - paragraph [ref=f29e37]: Thirty-four figures occupy the ground level, ten the loft and crossing margins, and six the belfry masonry. Their poses and attention vary. The central nave and carry axis, spiral mouths, narrow triforium, lesson recesses, bell sweep, hatch and arrival remain clear.
        - paragraph [ref=f29e38]: The dedicated models have shoulders, necks, hands, bent joints and uneven weight. Seated bodies meet the existing bench height. The figures are world-anchored shadow and residual energy, held in place through the established illuminated, torch and barely visible unlit states.
      - generic [ref=f29e39]:
        - paragraph [ref=f29e40]: "They remain entirely silent. The building carries the sound: wind at an opening, wood taking load, iron making contact, and bronze when an existing contact or combat event actually strikes it."
