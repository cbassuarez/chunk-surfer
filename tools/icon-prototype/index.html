<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>ASCII object — icon prototype</title>
    <style>
      html,body{margin:0;background:#07070a;color:#d8d2c0;font:12px ui-monospace,Menlo,monospace}
      .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px}
      .cell{border:1px solid #23232c;padding:12px}
      h2{font:11px ui-monospace;letter-spacing:.14em;color:#8a8676;margin:0 0 10px;text-transform:uppercase}
      .stage{height:340px}
      /* The component mounts its own position:relative wrapper and absolutely
         positions the canvas inside it at height:100%. With no height on that
         wrapper the canvas collapses to 1px and renders nothing, silently. */
      div:has(> canvas){height:100%}
      h2{text-transform:none}
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./main.tsx"></script></body>
</html>
