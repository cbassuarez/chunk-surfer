<!doctype html>
<html lang="en" class="cs-awaiting-styles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>chunk surfer // cbassuarez.com</title>
  <style>
    :root {
      color-scheme: dark;
      background: #020807;
      --critical-bg: #020807;
      /* Overwritten before first paint by the boot script below, from the
         player's saved phosphor. The literal here is the amber default so a
         first run, a cleared profile, or disabled storage still paints. */
      --critical-fg: #F2A81E;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      background: var(--critical-bg);
      color: var(--critical-fg);
      overflow: hidden;
    }

    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    #wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--critical-bg);
      opacity: 0;
      visibility: hidden;
    }

    html.cs-styles-ready #wrap {
      opacity: 1;
      visibility: visible;
    }

    #map,
    #introVignette,
    #hushJump {
      position: absolute;
      inset: 0;
    }

    #map {
      white-space: pre;
      font: inherit;
    }

    #introVignette,
    #hushJump {
      pointer-events: none;
    }

    .critical-noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--critical-bg);
      color: var(--critical-fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
      text-align: center;
    }

    #startupRecovery {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 16px;
      padding: 32px;
      box-sizing: border-box;
      color: var(--critical-fg);
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: center;
    }
    #startupRecovery[hidden], #startupRecovery [hidden] { display: none !important; }
    #startupRecovery h1, #startupRecovery p { margin: 0; font: inherit; }
    #startupRecovery h1 { font-size: 20px; }
    #startupRecovery::before {
      content: ""; position: absolute; inset: 0; background: var(--critical-bg);
      transition: opacity 140ms linear;
    }
    #startupRecovery[data-phase="ready"] { pointer-events: none; }
    #startupRecovery[data-phase="ready"]::before { opacity: 0; }
    #startupVan { width: min(32vw, 160px); aspect-ratio: 1; position: relative; overflow: hidden; }
    #startupVanPoster, #startupVanVideo { display: block; width: 100%; height: 100%; object-fit: contain; }
    #startupVanPoster { position: absolute; inset: 0; z-index: 1; }
    #startupRecovery[data-phase="ready"] #startupVanVideo {
      -webkit-mask-image: radial-gradient(ellipse 85% 76%, black 55%, transparent 92%);
      mask-image: radial-gradient(ellipse 85% 76%, black 55%, transparent 92%);
    }
    #startupVanPoster[data-repeating] { animation: startup-van-poster-pass 1.4s linear infinite; }
    #startupVanVideo[data-departing], #startupVanPoster[data-departing="exit"] {
      animation: startup-van-exit 360ms cubic-bezier(.35, .15, .65, .84) both;
    }
    #startupVanPoster[data-departing="pass"] { animation: startup-van-poster-pass 360ms linear both; }
    @keyframes startup-van-exit {
      from { transform: var(--startup-van-translate, translateX(0)); }
      to { transform: translateX(-100%); }
    }
    @keyframes startup-van-poster-pass { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    #startupRecovery h1, #startupRecovery p {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      #startupRecovery::before { transition: none; }
      #startupVanPoster[data-repeating] { animation: none; }
    }
  </style>
  <link id="mainStyles" rel="stylesheet" href="./styles.css?v=20260907-guided-case-tour">
  <script>
    (function () {
      var root = document.documentElement;

      // THE LOADING SCREEN BELONGS TO THE PLAYER'S PHOSPHOR TOO.
      //
      // Everything after boot resolves colour through render/palette.js, but
      // this paints before any module has loaded, so it had a grey-green
      // literal baked in and a green-phosphor player was greeted by an amber
      // machine wearing the wrong colour. Reading the saved setting here is the
      // only way to have it right on the FIRST frame rather than after the
      // stylesheet and the renderer arrive.
      //
      // These literals mirror palette.js THEMES/FORCED. They are duplicated
      // knowingly: an import cannot run before first paint. palette.js remains
      // the source of truth, and a value missing here simply falls back.
      try {
        var saved = window.localStorage.getItem('chunk-surfer:settings:v1');
        var phosphor = saved ? (JSON.parse(saved) || {}).phosphor : null;
        var LIT = {
          faithful: '#F2A81E', amber: '#F2A81E', green: '#5BF08A',
          aqua: '#66FFD4', filterBlue: '#7FD7FF', gold: '#FFE06A',
          warmWhite: '#EAF8F2', ember: '#FF6A38', cyan: '#59E7E7'
        };
        if (typeof phosphor === 'string' && phosphor) {
          // Named theme, or the custom hex the setting also accepts.
          var lit = LIT[phosphor] || (/^#[0-9a-fA-F]{3,8}$/.test(phosphor) ? phosphor : null);
          if (lit) root.style.setProperty('--critical-fg', lit);
        }
      } catch (_) {
        // Private mode, disabled storage, corrupt JSON: keep the default.
      }

      var sheet = document.getElementById('mainStyles');
      var marked = false;
      function markStylesReady() {
        if (marked) return;
        marked = true;
        root.classList.remove('cs-awaiting-styles');
        root.classList.add('cs-styles-ready');
      }
      if (!sheet) {
        markStylesReady();
        return;
      }
      sheet.addEventListener('load', markStylesReady, { once: true });
      sheet.addEventListener('error', function () {
        root.classList.add('cs-style-error');
        markStylesReady();
      }, { once: true });
      try {
        if (sheet.sheet) markStylesReady();
      } catch (_) {}
      window.setTimeout(function () {
        if (!marked) root.classList.add('cs-style-waiting');
      }, 600);
      window.setTimeout(markStylesReady, 4000);
    }());
  </script>
