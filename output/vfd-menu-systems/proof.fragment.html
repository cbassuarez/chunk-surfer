      <div class="proof-grid">
        <figure><figcaption>New game</figcaption><canvas aria-label="New game: fresh origin and empty path"></canvas></figure>

        <figure><figcaption>New game</figcaption><canvas aria-label="New game: empty run circuit with a fresh contact"></canvas></figure>
        <figure><figcaption>Continue</figcaption><canvas aria-label="Continue: populated run circuit rejoined at its contact"></canvas></figure>
        <figure><figcaption>Settings</figcaption><canvas aria-label="Settings: four parallel control channels"></canvas></figure>
      </div>
    </section>
  </div>
</div>
<style>
#cs-vfd-proof .proof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
#cs-vfd-proof figure{margin:0;min-width:0}
#cs-vfd-proof figcaption{margin-bottom:8px}
#cs-vfd-proof canvas{display:block;width:100%;height:auto}
#cs-vfd-proof .proof-label{color:var(--muted-foreground)}
@media(max-width:650px){#cs-vfd-proof .proof-grid{grid-template-columns:1fr}#cs-vfd-proof canvas{max-width:340px;margin:auto}}
</style>
