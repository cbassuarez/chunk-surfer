<!doctype html><html><head><meta charset="utf-8"><title>Contractor walk mesh proportions</title><style>html,body{margin:0;background:#161c1c;color:#e2e5d9;font:14px system-ui}main{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}section{position:relative;background:#202725;height:420px}h2{position:absolute;z-index:2;margin:14px;font-size:14px;font-weight:500}canvas{display:block;width:100%;height:100%}</style></head><body><main id="panels"></main><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {towerPersonalGeometry} from '/src/render/tower-personal-meshes.js';
const mats={wood:[.34,.20,.095],dark:[.16,.095,.052],black:[.025,.028,.03],steel:[.22,.24,.23],plaster:[.63,.62,.55],white:[.69,.72,.66],slate:[.075,.09,.105],green:[.075,.18,.12],cloth:[.12,.13,.12],navy:[.035,.075,.12],skin:[.50,.28,.18],hair:[.085,.055,.036],tape:[.27,.14,.065],paper:[.64,.60,.48],meter:[.018,.12,.055],ash:[.18,.19,.17]};
const views=[['tower_personal_boy','Boy · front',[1.5,1.2,-2.2],[0,.58,-.1]],['tower_personal_recordist_working','Contractor · approach from behind',[1.9,1.7,2.6],[0,.65,0]],['tower_personal_handover','Return hall · handover',[1.8,1.6,-2.9],[0,.85,-.1]],['tower_personal_service_window','Failed service window',[3.2,2.2,4.2],[0,1.4,0]],['tower_personal_mast','Mast · scaffold and service box',[12,7.4,15],[0,5,0]],['tower_personal_tape_lead','Loose strand · 12 metres',[5,6,4],[0,0,-5]]];
for(const [name,label,eye,target]of views){
 const section=document.createElement('section');section.innerHTML=`<h2>${label}</h2>`;document.querySelector('main').append(section);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(section.clientWidth,section.clientHeight);renderer.setPixelRatio(1);renderer.setClearColor('#202725');section.append(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,section.clientWidth/section.clientHeight,.01,100);camera.position.set(...eye);camera.lookAt(...target);
 scene.add(new THREE.AmbientLight(0xc3d1ce,1.8));const light=new THREE.DirectionalLight(0xffe8c7,3);light.position.set(-3,8,-4);scene.add(light);
 const piece=towerPersonalGeometry().find(p=>p.name===name);
 for(const g of piece.groups){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(g.positions,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(g.normals,3));geo.setIndex(g.indices);const material=new THREE.MeshStandardMaterial({color:new THREE.Color(...mats[g.material]),roughness:.85,metalness:g.material==='steel'?.3:0,side:THREE.DoubleSide});scene.add(new THREE.Mesh(geo,material));}
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x454b42,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;scene.add(floor);renderer.render(scene,camera);
}window.meshPreviewReady=true;
</script></body></html>
