<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exposed Recordist · Production Hand Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101713;color:#c8d1bd;font:13px ui-monospace,monospace}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}h1{font-size:17px;font-weight:500;letter-spacing:.06em;margin:0}header span{font-size:11px;color:#8e9e88}canvas{width:100%;height:390px;display:block;background:radial-gradient(ellipse at 52% 40%,#17231c,#050a07 75%);border-bottom:1px solid #495342}form{display:flex;flex-wrap:wrap;gap:14px;align-items:end;padding:20px 0}label{display:grid;gap:6px;color:#9faa95;font-size:11px}select,button,input{font:inherit;accent-color:#b7c59c}select,button{color:#d2dbc6;background:#253025;border:1px solid #4b5b43;border-radius:3px;min-height:36px;padding:7px 10px}button[aria-pressed=true]{background:#bdc6a4;color:#172217}.states{display:flex;gap:5px;flex-wrap:wrap}.transport{display:flex;gap:14px;align-items:center;width:100%;padding:0 0 20px}.transport input[type=range]{flex:1}.check{display:flex;align-items:center;gap:6px;white-space:nowrap}.metrics{color:#9ead97;font-size:12px;line-height:1.8;padding-top:15px;border-top:1px solid #35422f}output{display:block;white-space:pre-wrap;color:#a7b89c;line-height:1.8}small{display:block;color:#82927b;padding-top:10px}@media(max-width:600px){main{padding:14px}header{display:block}header span{display:block;margin-top:8px}canvas{height:340px}.transport{flex-wrap:wrap}.transport input[type=range]{min-width:100%;order:3}}
</style></head><body><main>
<header><h1>THE EXPOSED RECORDIST</h1><span>Final game shader · articulated anatomy · planted contacts · <a style="color:inherit" href="/artifacts/battle-hands/combat.html">Live battle</a></span></header>
<canvas aria-label="Production battle hand and tool rendering" width="1152" height="390"></canvas>
<form onsubmit="return false">
<label>FIELD TOOL<select id="tool"><option value="recorder">DA–1000 recorder</option><option value="torch">Field torch</option><option value="radio">Radio</option><option value="rig">Bent rig</option><option value="fork">Tuning fork</option><option value="spanner">Adjustable spanner</option><option value="coffee">Coffee</option><option value="self">Empty hands</option></select></label>
<label>ACTION<select id="action"></select></label>
<label>PERSISTENT INJURY<select id="injury"><option value="steady">Steady</option><option value="hurt">Hurt</option><option value="wounded">Wounded</option><option value="critical">Critical</option></select></label>
<label>FINISH<select id="finish"><option value="aluminum">Aluminum</option><option value="black">Black anodized</option><option value="olive">Olive</option><option value="witness">Witness</option></select></label>
<div class="states" role="group" aria-label="Animation keyframe"><button data-pose="ready" aria-pressed="true">Ready</button><button data-pose="operate" aria-pressed="false">Operate</button><button data-pose="brace" aria-pressed="false">Brace</button><button data-pose="parry" aria-pressed="false">Parry</button><button data-pose="hurt" aria-pressed="false">Hurt</button></div>
</form>
<div class="transport"><button id="play">Play performance</button><span id="time">0.00 / 8.00 s</span><input id="scrub" type="range" min="0" max="8" step="0.01" value="0" aria-label="Scrub performance"><label class="check"><input id="reduced" type="checkbox">Reduced motion</label><label class="check"><input id="wet" type="checkbox">Wet hands</label></div>
<button id="verify">Verify print</button><output id="print-check" hidden></output>
<output id="contacts" aria-live="polite">Loading anatomical hand rig…</output><small>The same renderer, materials, and final acquisition shader used by the battle screen. Contact errors below are measured in millimetres at the finger pads.</small>
</main><script type="module">
import { drawBattleHands3D, warmBattleHands, battleHandsDiagnostics } from '/src/render/battle-hands.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),tool=document.querySelector('#tool'),action=document.querySelector('#action'),injury=document.querySelector('#injury'),finish=document.querySelector('#finish'),scrub=document.querySelector('#scrub'),play=document.querySelector('#play'),reduced=document.querySelector('#reduced'),wet=document.querySelector('#wet'),time=document.querySelector('#time'),contacts=document.querySelector('#contacts');
let t=0,playing=false,last=0,lastReport='';
const actions={recorder:[['monitor','Monitor'],['playback','Playback'],['master-take','Master take']],torch:[['expose','Expose'],['whiteout','Whiteout']],radio:[['channel','Channel'],['radio-decoy','Throw voice']],rig:[['invert','Invert'],['runaway-feedback','Runaway feedback']],fork:[['tune','Tune']],spanner:[['swing','Swing'],['spanner-guard','Guard']],coffee:[['steady-hands','Steady hands']],self:[['compose','Breathe'],['shout','Shout'],['hold','Hold']]};
function setActions(){action.replaceChildren(...actions[tool.value].map(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;return option;}));}tool.addEventListener('change',setActions);setActions();
const sample={ready:0,operate:1.136,brace:2.65,parry:4.092857,hurt:5.228571};
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*Math.min(devicePixelRatio,1.5));canvas.height=Math.round(r.height*Math.min(devicePixelRatio,1.5));}new ResizeObserver(resize).observe(canvas);resize();
function pose(){if(t<.8)return ['ready',t/.8];if(t<2)return ['operate',(t-.8)/1.2];if(t<3.2)return ['brace',(t-2)/1.2];if(t<4.628571)return ['parry',(t-3.2)/1.428571];if(t<5.828571)return ['hurt',(t-4.628571)/1.2];return ['ready',0];}
for(const b of document.querySelectorAll('[data-pose]'))b.onclick=()=>{playing=false;play.textContent='Play performance';t=sample[b.dataset.pose];scrub.value=t;};
scrub.oninput=()=>{playing=false;play.textContent='Play performance';t=Number(scrub.value);};play.onclick=()=>{playing=!playing;if(playing&&t>=8)t=0;play.textContent=playing?'Pause performance':'Play performance';};
document.querySelector('#verify').onclick=()=>{const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let transparent=0,opaque=0,edge=0,dark=0,light=0,middle=0;for(let i=0;i<data.length;i+=4){if(data[i+3]===0){transparent++;continue;}if(data[i+3]<254){edge++;continue;}opaque++;const y=(.2126*data[i]+.7152*data[i+1]+.0722*data[i+2])/255;if(y<.035)dark++;else if(y>.70)light++;else middle++;}const out=document.querySelector('#print-check');out.hidden=false;out.textContent=JSON.stringify({width:canvas.width,height:canvas.height,transparent,opaque,edge,dark,light,middle});};
warmBattleHands();
function frame(ms){if(playing)t=Math.min(8,t+(ms-last)/1000);last=ms;if(t>=8){playing=false;play.textContent='Play performance';}const [state,p]=pose(),enemy=['brace','parry','hurt'].includes(state);const move=action.value;
ctx.clearRect(0,0,canvas.width,canvas.height);const rendered=drawBattleHands3D({ctx,width:canvas.width,height:canvas.height,pixelRatio:Math.min(devicePixelRatio,1.5),tool:tool.value,phase:state==='ready'?'tool':'resolve',move:state==='operate'?move:null,actionActor:state==='ready'?null:enemy?'enemy':'player',rawProgress:p,actionElapsed:p*(enemy?1.428571:1.2),actionDuration:enemy?1.428571:1.2,impactFired:p>=.28,now:ms/1000,injury:injury.value,snr:'signal',hurt:state==='hurt'?Math.sin(p*Math.PI):0,brace:state==='brace',parry:state==='parry'?{impactSeconds:.892857,contactEnds:.982143,phase:p<.625?'turned':'contact',parried:true}:null,reducedMotion:reduced.checked,wet:wet.checked?1:0,cosmetics:{faceplate:finish.value,buttons:'classic',vfd:'faithful'},readout:{counter:'00:00',counterLabel:'ACTION COUNTER',elapsedSeconds:state==='operate'?p*1.2:0,locationSeconds:1.2,progress:state==='operate'?p:0,active:state==='operate',capture:state==='operate'&&['monitor','master-take'].includes(move),recording:state==='operate'&&p>=.28&&['monitor','master-take'].includes(move),playing:state==='operate'&&p>=.28&&move==='playback',meter:{db:-96,peakDb:-96},meterLabel:'OUTPUT LEVEL'}});
scrub.value=t;time.textContent=t.toFixed(2)+' / 8.00 s';for(const b of document.querySelectorAll('[data-pose]'))b.setAttribute('aria-pressed',String(b.dataset.pose===state));const d=battleHandsDiagnostics();const report=d.error?d.error:!rendered?'Loading anatomical hand rig…':Object.entries(d.grip||{}).map(([finger,v])=>finger.toUpperCase()+'  '+(v.error*1000).toFixed(2)+' mm'+(v.reached?' · planted':' · out of reach')).join('    ')+(d.display?'\nFINAL SHADER  '+d.display.shader+' · '+d.display.profile+' / '+d.display.screen+' · '+d.display.width+' × '+d.display.height+' px':'')+(d.control?'\nCONTROL  '+Object.entries(d.control).map(([f,v])=>f+' '+(v.error*1000).toFixed(2)+' mm').join('  '):'');if(report!==lastReport){contacts.textContent=report;lastReport=report;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
