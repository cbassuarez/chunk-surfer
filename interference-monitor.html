<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUDIOCORP / WINDOW CHANNEL</title>
    <style>
      :root{color-scheme:dark;--bg:#030606;--line:#74a49b;--ink:#d5d0a3;--wound:#381315;background:var(--bg);color:var(--ink);font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at 50% 8%,color-mix(in srgb,var(--line) 13%,var(--bg)),var(--bg) 62%);min-height:100vh;overflow:hidden}main{height:calc(100vh - 28px);display:grid;grid-template-rows:auto minmax(120px,1fr) auto auto;gap:10px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:11px;box-shadow:inset 0 0 70px rgba(0,0,0,.52)}header{display:flex;justify-content:space-between;gap:10px;color:var(--line);border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);padding-bottom:8px;letter-spacing:.12em;white-space:nowrap;overflow:hidden}header span{overflow:hidden;text-overflow:ellipsis}#state{color:var(--ink)}#tableau{width:100%;height:100%;min-height:140px;background:var(--bg);border:1px solid color-mix(in srgb,var(--line) 42%,transparent);cursor:default}#caption{min-height:2.9em;color:var(--ink);letter-spacing:.06em;white-space:pre-line}#action{display:none;justify-self:center;border:1px solid var(--line);background:color-mix(in srgb,var(--wound) 72%,black);color:var(--ink);font:inherit;letter-spacing:.14em;padding:10px 16px;cursor:pointer}#action:hover,#action:focus{outline:2px solid var(--ink);outline-offset:2px}body[data-interactive="true"] #tableau{cursor:pointer}body[data-interactive="true"] #action{display:block}footer{position:absolute;right:25px;bottom:20px;display:flex;align-items:center;gap:10px;color:color-mix(in srgb,var(--line) 72%,transparent);font-size:10px}#restore{border:1px solid color-mix(in srgb,var(--line) 75%,transparent);background:#050707;color:var(--line);font:inherit;padding:5px 8px;cursor:pointer}:root[data-mode="echo"] header{writing-mode:vertical-rl;position:absolute;right:20px;top:20px;height:42vh;border:0;border-left:1px solid var(--line);padding:0 0 0 8px}:root[data-mode="echo"] main{padding-right:44px}:root[data-mode="echo"] #caption{font-size:11px}:root[data-mode="echo"] footer span{display:none}
    </style>
  </head>
  <body data-interactive="false">
    <main>
      <header><span id="title">AUDIOCORP / WINDOW CHANNEL</span><span id="state">MONITOR RETURN</span></header>
      <canvas id="tableau" aria-label="A battle-specific interference tableau"></canvas>
      <div id="caption">THE RETURN PATH IS QUIET.</div>
      <button id="action" type="button">CUT THIS CHANNEL</button>
    </main>
    <footer><span>HOLD ESC TO RESTORE ALL GAME WINDOWS.</span><button id="restore" type="button">RESTORE</button></footer>
    <script type="module" src="/src/interference-monitor.js"></script>
  </body>
</html>
