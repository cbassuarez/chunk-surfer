name: Release Desktop Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.0-beta.1'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-14
            artifact: chunk-surfer-macos-arm64
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            args: --config src-tauri/tauri.lens.conf.json --target aarch64-apple-darwin --bundles dmg
            bundle_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            platform: windows-latest
            artifact: chunk-surfer-windows-x64
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            args: --config src-tauri/tauri.lens.conf.json --bundles nsis
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            platform: ubuntu-22.04
            artifact: chunk-surfer-linux-x64
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            args: --config src-tauri/tauri.lens.conf.json --bundles appimage,deb
            bundle_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node scripts/release-preflight.mjs "$RELEASE_TAG"

      - name: Install pinned lens bundler dependencies
        run: python -m pip install -r tools/chunk_surfer/diffusion_server/requirements-local.txt pyinstaller==6.16.0

      - name: Build offline lens sidecar and pinned resources
        run: python tools/chunk_surfer/diffusion_server/build_bundle.py --target ${{ matrix.target }}

      - name: Run frontend tests
        run: npm test

      - name: Run acoustic catalogue checks
        run: npm run test:acoustic

      - name: Run desktop menu tests
        run: npm run test:desktop-menu

      - name: Check Tauri Rust
        run: npm run tauri:check

      - name: Build Tauri bundles
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  publish-prerelease:
    name: Publish beta prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify local bundle set
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -gt 0
          test "$(find release-assets -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)" -gt 0
          test "$(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -gt 0
          while IFS= read -r file; do test -s "$file"; done < <(find release-assets -type f)

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="release-notes.md"
          cat > "$notes_file" <<'EOF'
          Unsigned beta desktop builds for end-to-end download testing.

          Expected assets:
          - macOS: dmg
          - Windows: exe and/or msi installer
          - Linux: AppImage and deb bundle

          Signing, notarization, Steam, and itch automation remain TODOs in STORE_PREP.md.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          fi
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release-assets \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb'
          find downloaded-release-assets -maxdepth 1 -type f -print -exec test -s {} \;
          test "$(find downloaded-release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -gt 0
          test "$(find downloaded-release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)" -gt 0
          test "$(find downloaded-release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -gt 0
