name: Release Desktop Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate or publish, for example v0.3.0'
        required: true
        type: string
      publish:
        description: 'Publish validated artifacts to itch and GitHub'
        required: true
        default: false
        type: boolean
      platform:
        description: 'Platform to validate; publishing always requires all platforms'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
  push:
    tags:
      - 'v*'

jobs:
  configure:
    name: Configure release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select release platforms
        id: matrix
        env:
          RELEASE_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: node scripts/release-matrix.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Free Linux runner disk
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      # ffprobe is a BUILD dependency, not a test one: `npm run build` runs
      # media:validate, and tauri runs `npm run build` as its beforeBuildCommand.
      # ci.yml has installed ffmpeg since the window media landed; this workflow
      # never did, so every release runner failed inside the Tauri bundle step
      # with one "<asset>:<kind>:probe" line per asset and no other explanation.
      # Verified here so a missing binary fails at setup rather than twenty-five
      # minutes later, in the middle of a build, looking like an asset fault.
      - name: Install ffmpeg
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffprobe >/dev/null 2>&1; then
            echo "ffprobe already present"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg -y --no-progress
          fi

      - name: Verify ffprobe
        shell: bash
        run: ffprobe -version

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Build-only rasterisers are independent of the optional SD service.
      # They generate/check authored lettering and are never bundle resources.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install authored rasteriser test dependencies
        shell: bash
        run: |
          python -m venv .paper-venv
          python - <<'PYTHON'
          import os
          import pathlib
          import subprocess
          interpreter = (pathlib.Path('.paper-venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')).resolve()
          subprocess.check_call([str(interpreter), '-m', 'pip', 'install', 'Pillow==12.3.0', 'numpy==2.3.5'])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'PAPER_PYTHON={interpreter}\n')
              env_file.write(f'CHUNK_SURFER_LETTERING_PYTHON={interpreter}\n')
          PYTHON

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node scripts/release-preflight.mjs "$RELEASE_TAG"

      - name: Run frontend tests
        run: npm test

      - name: Run acoustic catalogue checks
        run: npm run test:acoustic

      - name: Run desktop menu tests
        run: npm run test:desktop-menu

      - name: Run cross-platform visual smoke
        timeout-minutes: 10
        env:
          FEATURE_SMOKE_TIMEOUT_MS: ${{ matrix.platform == 'ubuntu-22.04' && '540000' || '300000' }}
          FEATURE_SMOKE_FRAME_TIMEOUT_MS: ${{ matrix.platform == 'ubuntu-22.04' && '60000' || matrix.platform == 'windows-latest' && '30000' || '10000' }}
        run: npm run test:feature-smoke

      - name: Upload visual parity captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ matrix.target }}
          path: artifacts/feature-regression-smoke
          if-no-files-found: warn

      - name: Check Tauri Rust
        run: npm run tauri:check

      - name: Run Windows native process tests
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Build Tauri bundles
        if: matrix.platform != 'ubuntu-22.04'
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Verify delivered macOS DMG contents
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          dmgs=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test -f "${dmgs[0]}"
          for dmg in "${dmgs[@]}"; do
            unpack="$(mktemp -d)"
            trap 'hdiutil detach "$unpack" >/dev/null 2>&1 || true; rmdir "$unpack" 2>/dev/null || true' EXIT
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$unpack" >/dev/null
            app_dir="$(find "$unpack" -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app_dir"
            npm run lean:verify -- "$app_dir"
            hdiutil detach "$unpack" >/dev/null
            rmdir "$unpack" 2>/dev/null || true
            trap - EXIT
          done

      # Build one Linux package at a time to reduce hosted-runner disk pressure;
      # neither package includes a model runtime or model weights.
      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles appimage

      - name: Verify lean Linux AppImage contents
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test -f "${images[0]}"
          for image in "${images[@]}"; do
            unpack="$(mktemp -d)"
            trap 'rm -rf "$unpack"' EXIT
            (cd "$unpack" && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
            npm run lean:verify -- "$unpack/squashfs-root"
            rm -rf "$unpack"
            trap - EXIT
          done

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-surfer-linux-appimage-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Reclaim Linux AppImage staging space
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle/appimage
          df -h

      - name: Build Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles deb

      - name: Verify lean Linux deb contents
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          test -f "${debs[0]}"
          for deb in "${debs[@]}"; do
            unpack="$(mktemp -d)"
            trap 'rm -rf "$unpack"' EXIT
            dpkg-deb -x "$deb" "$unpack"
            npm run lean:verify -- "$unpack"
            rm -rf "$unpack"
            trap - EXIT
          done

      - name: Upload Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-surfer-linux-deb-x64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/package-windows-portable.mjs

          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseRoot = "release/windows"
          $zipName = "chunk-surfer-v$version-windows-x64.zip"
          $zip = Join-Path $releaseRoot $zipName

          $sevenZipCandidates = @((Get-Command 7z -ErrorAction SilentlyContinue).Source)
          if ($env:ProgramFiles) {
            $sevenZipCandidates += Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          }
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ($programFilesX86) {
            $sevenZipCandidates += Join-Path $programFilesX86 "7-Zip/7z.exe"
          }
          $sevenZip = $sevenZipCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sevenZip) {
            throw "7-Zip is required for the Windows portable archive verification"
          }

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Push-Location $releaseRoot
          try {
            & $sevenZip a -tzip -mx=1 $zipName "Chunk Surfer"
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip archive creation failed with exit code $LASTEXITCODE"
            }

            & $sevenZip t $zipName
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip archive verification failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          $verifyRoot = "release/windows-verify"
          Remove-Item $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $verifyRoot -Force
          node scripts/validate-windows-portable.mjs "$verifyRoot/Chunk Surfer"

      - name: Upload desktop bundles
        if: matrix.platform != 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  publish-itch:
    name: Publish itch beta channels
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      ITCH_CONFIRM_PUSH: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify itch environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY"
          test -n "$ITCH_TARGET"

      - name: Install Butler
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d .butler
          chmod +x .butler/butler
          echo "$PWD/.butler" >> "$GITHUB_PATH"
          .butler/butler version

      - name: Stage itch builds
        run: npm run itch:stage

      - name: Preview itch channel changes
        run: npm run itch:preview

      - name: Push itch channels
        run: npm run itch:push

  publish-prerelease:
    name: Publish beta prerelease
    needs: [build, publish-itch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify local bundle set
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -gt 0
          test "$(find release-assets -type f -name '*windows-x64.zip' | wc -l)" -gt 0
          test "$(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -gt 0
          while IFS= read -r file; do test -s "$file"; done < <(find release-assets -type f)

      - name: Prepare release upload assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload-assets
          find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | while IFS= read -r -d '' file; do
                name="$(basename "$file")"
                size="$(stat -c%s "$file")"
                if [ "$size" -ge 2000000000 ]; then
                  sha256sum "$file" > "release-upload-assets/$name.sha256"
                  split -b 1900M -d -a 2 -- "$file" "release-upload-assets/$name.part-"
                else
                  cp "$file" "release-upload-assets/$name"
                fi
              done
          find release-upload-assets -maxdepth 1 -type f -print
          while IFS= read -r file; do
            test -s "$file"
            test "$(stat -c%s "$file")" -lt 2147483648
          done < <(find release-upload-assets -maxdepth 1 -type f)

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="release-notes.md"
          # The notes are the tag's own CHANGELOG section; release-preflight
          # refuses to pass a tag that has not got one, so this cannot silently
          # publish an empty release. The asset boilerplate below is the same
          # for every build and stays here rather than in the changelog.
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> "$notes_file" <<'EOF'

          ---

          Public beta downloads are staged on itch.io first. Use these GitHub
          assets as a developer mirror when testing CI output or recovering a
          specific build artifact.

          Expected assets:
          - macOS: dmg
          - Windows: portable zip
          - Linux: AppImage and deb bundle

          Assets larger than GitHub's 2 GiB per-file release limit are split as
          .part-00, .part-01, ... files with a matching .sha256 manifest. These
          split files are not the recommended player download path.

          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | while IFS= read -r asset; do
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
              done
          find release-upload-assets -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release-assets \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.part-*' --pattern '*.sha256'
          find downloaded-release-assets -maxdepth 1 -type f -print -exec test -s {} \;
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.dmg.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*windows-x64.zip' -o -name '*windows-x64.zip.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.AppImage.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.deb' -o -name '*.deb.part-*' \) | grep -q .
