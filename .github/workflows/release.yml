name: Release Desktop Builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.1-beta.10'
        required: true
        type: string
      publish:
        description: 'Publish validated artifacts to itch and GitHub'
        required: true
        default: false
        type: boolean
      platform:
        description: 'Platform to validate; publishing always requires all platforms'
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
  push:
    tags:
      - 'v*'

jobs:
  configure:
    name: Configure release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Select release platforms
        id: matrix
        env:
          RELEASE_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
        run: node scripts/release-matrix.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Free Linux runner disk
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup
          docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node scripts/release-preflight.mjs "$RELEASE_TAG"

      - name: Restore packaged lens bundle
        id: lens-bundle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/binaries/chunk-lens-${{ matrix.target }}*
            src-tauri/lens-resources/lens
          key: lens-bundle-v1-${{ matrix.target }}-py312-${{ hashFiles('tools/chunk_surfer/diffusion_server/*.py', 'tools/chunk_surfer/diffusion_server/requirements-local.txt', 'THIRD_PARTY_LENS_NOTICES.md') }}

      - name: Install pinned lens bundler dependencies
        if: steps.lens-bundle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --no-cache-dir -r tools/chunk_surfer/diffusion_server/requirements-local.txt pyinstaller==6.16.0

      - name: Build offline lens sidecar and pinned resources
        if: steps.lens-bundle-cache.outputs.cache-hit != 'true'
        run: python tools/chunk_surfer/diffusion_server/build_bundle.py --target ${{ matrix.target }}

      - name: Cache packaged lens bundle
        if: steps.lens-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/binaries/chunk-lens-${{ matrix.target }}*
            src-tauri/lens-resources/lens
          key: ${{ steps.lens-bundle-cache.outputs.cache-primary-key }}

      - name: Trim Linux lens build scratch space
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lens-build ~/.cache/huggingface ~/.cache/pip
          df -h

      - name: Run frontend tests
        run: npm test

      - name: Run acoustic catalogue checks
        run: npm run test:acoustic

      - name: Run desktop menu tests
        run: npm run test:desktop-menu

      - name: Run cross-platform visual smoke
        timeout-minutes: 10
        env:
          FEATURE_SMOKE_TIMEOUT_MS: ${{ matrix.os == 'ubuntu-latest' && '540000' || '300000' }}
        run: npm run test:feature-smoke

      - name: Upload visual parity captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ matrix.target }}
          path: artifacts/feature-regression-smoke
          if-no-files-found: warn

      - name: Check Tauri Rust
        run: npm run tauri:check

      - name: Build Tauri bundles
        if: matrix.platform != 'ubuntu-22.04'
        run: npm run tauri:build -- ${{ matrix.args }}

      # The offline lens makes each Linux bundle several gigabytes while Tauri is
      # staging it. Upload and remove the AppImage tree before staging the deb so
      # both expanded package trees never compete for hosted-runner disk space.
      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles appimage

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-surfer-linux-appimage-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Reclaim Linux AppImage staging space
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle/appimage
          df -h

      - name: Build Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri:build -- --bundles deb

      - name: Upload Linux deb
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: chunk-surfer-linux-deb-x64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/package-windows-portable.mjs
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/windows/Chunk Surfer" -DestinationPath "release/windows/chunk-surfer-v$version-windows-x64.zip" -Force

      - name: Upload desktop bundles
        if: matrix.platform != 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  publish-itch:
    name: Publish itch beta channels
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
      ITCH_CONFIRM_PUSH: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify itch environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY"
          test -n "$ITCH_TARGET"

      - name: Install Butler
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d .butler
          chmod +x .butler/butler
          echo "$PWD/.butler" >> "$GITHUB_PATH"
          .butler/butler version

      - name: Stage itch builds
        run: npm run itch:stage

      - name: Preview itch channel changes
        run: npm run itch:preview

      - name: Push itch channels
        run: npm run itch:push

  publish-prerelease:
    name: Publish beta prerelease
    needs: [build, publish-itch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify local bundle set
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          test "$(find release-assets -type f -name '*.dmg' | wc -l)" -gt 0
          test "$(find release-assets -type f -name '*windows-x64.zip' | wc -l)" -gt 0
          test "$(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -gt 0
          while IFS= read -r file; do test -s "$file"; done < <(find release-assets -type f)

      - name: Prepare release upload assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload-assets
          find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | while IFS= read -r -d '' file; do
                name="$(basename "$file")"
                size="$(stat -c%s "$file")"
                if [ "$size" -ge 2000000000 ]; then
                  sha256sum "$file" > "release-upload-assets/$name.sha256"
                  split -b 1900M -d -a 2 -- "$file" "release-upload-assets/$name.part-"
                else
                  cp "$file" "release-upload-assets/$name"
                fi
              done
          find release-upload-assets -maxdepth 1 -type f -print
          while IFS= read -r file; do
            test -s "$file"
            test "$(stat -c%s "$file")" -lt 2147483648
          done < <(find release-upload-assets -maxdepth 1 -type f)

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="release-notes.md"
          cat > "$notes_file" <<'EOF'
          Unsigned beta desktop builds for end-to-end download testing.

          Public beta downloads are staged on itch.io first. Use these GitHub
          assets as a developer mirror when testing CI output or recovering a
          specific build artifact.

          Expected assets:
          - macOS: dmg
          - Windows: portable zip
          - Linux: AppImage and deb bundle

          Assets larger than GitHub's 2 GiB per-file release limit are split as
          .part-00, .part-01, ... files with a matching .sha256 manifest. These
          split files are not the recommended player download path.

          Signing, notarization, and Steam automation remain TODOs in STORE_PREP.md.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chunk Surfer $TAG" --notes-file "$notes_file" --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | while IFS= read -r asset; do
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
              done
          find release-upload-assets -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release-assets \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.part-*' --pattern '*.sha256'
          find downloaded-release-assets -maxdepth 1 -type f -print -exec test -s {} \;
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.dmg.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*windows-x64.zip' -o -name '*windows-x64.zip.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.AppImage.part-*' \) | grep -q .
          find downloaded-release-assets -maxdepth 1 -type f \( -name '*.deb' -o -name '*.deb.part-*' \) | grep -q .
