name: Release Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      # TODO: Apple Developer ID signing and notarization.
      # TODO: Windows code signing certificate and timestamping.
      # TODO: Tauri updater signing keys.
      # TODO: Steam build pipeline.
      # TODO: itch Butler publishing.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: chunk-surfer-v__VERSION__
          releaseName: Chunk Surfer v__VERSION__
          releaseBody: Unsigned desktop builds for local testing. Signing and storefront packaging are tracked in STORE_PREP.md.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
