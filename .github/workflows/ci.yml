name: CI

on:
  pull_request:
  push:
    branches: [main, room-tone]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev
          ffprobe -version

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # The paper rasteriser's spec renders through Pillow. Same repo-local venv
      # the paper tools look for first, so nothing installs into system python.
      - name: Install Pillow for the paper rasteriser
        run: |
          python3 -m venv .paper-venv
          .paper-venv/bin/pip install Pillow==12.3.0

      - run: npm install
      - run: npm test
      - run: npm run test:acoustic
      - run: npm run test:desktop-menu
      - run: npm run build
      - run: npm run tauri:check

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-surfer-web-dist
          path: dist
          if-no-files-found: error
